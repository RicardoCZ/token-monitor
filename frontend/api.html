<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Token Monitor ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        .header h1 { font-size: 24px; color: #e0e0e0; margin-bottom: 5px; }
        .header p { font-size: 12px; color: #888; }
        
        .cards { max-width: 600px; margin: 0 auto; }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card-title { font-size: 18px; font-weight: 600; }
        
        .card-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .badge-ok { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .badge-error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .badge-warn { background: rgba(255, 152, 0, 0.2); color: #FF9800; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #999; font-size: 14px; }
        .stat-value { font-weight: 600; font-size: 14px; color: #fff; }
        
        /* 卡片主体纵向排列，进度条固定在所有文案块之后 */
        .service-card-content {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
        }
        
        .card-stats-block { flex: 0 0 auto; order: 0; }
        .card-meta-block { flex: 0 0 auto; order: 1; margin-top: 0; }
        .card-progress-wrap {
            flex: 0 0 auto;
            order: 2;
            width: 100%;
            margin-top: 12px;
        }
        
        .meta-row-first {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.green { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .progress-fill.orange { background: linear-gradient(90deg, #FF9800, #FFC107); }
        .progress-fill.red { background: linear-gradient(90deg, #f44336, #E91E63); }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .login-box {
            text-align: center;
            padding: 20px;
        }
        
        .error-detail {
            font-size: 12px;
            color: #f44336;
            margin-top: 8px;
            padding: 8px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .refresh-btn:active { transform: scale(0.95); }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .last-update {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 20px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-content h3 { font-size: 18px; margin-bottom: 10px; color: #fff; }
        .modal-content p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        
        .modal-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.1); color: #888; }

        /** 监控页顶栏：设置 Cookie / 管理后台 / 退出 同一套文字链风格 */
        .header-top-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .header-top-link:hover {
            color: #8b9cff;
        }

        .history-filter-panel {
            max-width: 600px;
            margin: 0 auto 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .history-filter-panel .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-filter-panel label {
            font-size: 12px;
            color: #a8b0d3;
        }

        .history-filter-panel input,
        .history-filter-panel select {
            width: 100%;
            min-height: 34px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(10, 12, 22, 0.5);
            color: #fff;
            padding: 6px 8px;
            font-size: 13px;
        }

        .history-filter-panel .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .history-filter-panel .actions button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }

        .history-filter-panel .btn-apply {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .history-filter-panel .btn-reset {
            background: rgba(255, 255, 255, 0.14);
        }

        .history-filter-panel .status {
            font-size: 12px;
            color: #9aa2c1;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Token Monitor</h1>
        <p>API 额度实时监控</p>
        <div id="user-info" style="margin-top: 10px; font-size: 12px; color: #888; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;"></div>
    </div>

    <div class="history-filter-panel">
        <div class="field">
            <label for="history-metric-key">metric_key</label>
            <select id="history-metric-key">
                <option value="">全部</option>
            </select>
        </div>
        <div class="field">
            <label for="history-start-at">start_at</label>
            <input id="history-start-at" type="datetime-local">
        </div>
        <div class="field">
            <label for="history-end-at">end_at</label>
            <input id="history-end-at" type="datetime-local">
        </div>
        <div class="field">
            <label for="history-limit">limit</label>
            <select id="history-limit">
                <option value="1" selected>1</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </div>
        <div class="actions">
            <button class="btn-apply" id="history-apply-btn">应用筛选</button>
            <button class="btn-reset" id="history-reset-btn">重置</button>
            <span class="status" id="history-filter-status">当前：默认（最新 1 条）</span>
        </div>
    </div>
    
    <div class="cards" id="services-cards">
        <div class="card">
            <div class="card-header">
                <span class="card-title">服务加载中</span>
                <span class="card-badge badge-ok">初始化</span>
            </div>
            <div class="service-card-content">
                <div class="loading">正在加载服务注册表</div>
            </div>
        </div>
    </div>
    
    <div class="last-update" id="last-update"></div>
    
    <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">↻</button>
    
    <!-- 登录引导弹窗 -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">需要登录</h3>
            <p id="modal-desc">请点击下方按钮前往登录</p>
            <button class="modal-btn" id="modal-login-btn">去登录</button>
            <button class="modal-btn secondary" onclick="closeModal()">取消</button>
        </div>
    </div>
    
    <script>
        // API 基础地址
        const API_BASE = window.location.origin;
        
        // 用户状态
        let currentUser = null;
        let authToken = localStorage.getItem('token');
        let serviceRegistry = [];
        let historyFilters = {
            metric_key: "",
            start_at: "",
            end_at: "",
            limit: 1,
            offset: 0,
        };
        
        // 检查登录状态
        async function checkAuth() {
            const userInfo = document.getElementById('user-info');
            
            if (!authToken) {
                // 未登录，跳转到登录页
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                const resp = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (resp.ok) {
                    currentUser = await resp.json();
                    
                    // 管理员显示管理入口
                    let adminLink = '';
                    if (currentUser.role === 'admin') {
                        adminLink = '<a href="admin.html" class="header-top-link">⚙️ 管理后台</a>';
                    }
                    
                    userInfo.innerHTML = `
                        <span>👤 ${currentUser.username}</span>
                        <a href="setup.html" class="header-top-link">🔧 设置 Cookie</a>
                        ${adminLink}
                        <span class="header-top-link" style="cursor: pointer;" role="button" tabindex="0" onclick="logout()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();logout();}">退出</span>
                    `;
                    return true;
                } else {
                    // Token 无效
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return false;
                }
            } catch (e) {
                console.error('Auth check failed:', e);
                return false;
            }
        }
        
        // 登出
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        async function refreshAll() {
            const btn = document.getElementById("refresh-btn");
            btn.classList.add("spinning");
            try {
                await syncServiceRegistry();
                const accountsByService = await loadAccountMapByService();
                await Promise.all(serviceRegistry.map((service) => refreshServiceCard(service, accountsByService)));
                document.getElementById("last-update").textContent =
                    "最后更新: " + new Date().toLocaleTimeString("zh-CN");
            } finally {
                btn.classList.remove("spinning");
            }
        }

        function toUtcIsoOrEmpty(localValue) {
            if (!localValue) return "";
            const dt = new Date(localValue);
            if (Number.isNaN(dt.getTime())) return "";
            return dt.toISOString();
        }

        function toLocalInputValue(isoValue) {
            if (!isoValue) return "";
            const dt = new Date(isoValue);
            if (Number.isNaN(dt.getTime())) return "";
            const offset = dt.getTimezoneOffset() * 60000;
            const local = new Date(dt.getTime() - offset);
            return local.toISOString().slice(0, 16);
        }

        function normalizeHistoryLimit(rawValue) {
            const num = Number(rawValue || 1);
            return Number.isFinite(num) ? Math.max(1, Math.min(20, num)) : 1;
        }

        function writeHistoryFiltersToUrl() {
            const url = new URL(window.location.href);
            const params = url.searchParams;
            const setOrDelete = (key, value) => {
                if (value === "" || value == null) params.delete(key);
                else params.set(key, String(value));
            };
            setOrDelete("metric_key", historyFilters.metric_key);
            setOrDelete("start_at", historyFilters.start_at);
            setOrDelete("end_at", historyFilters.end_at);
            setOrDelete("limit", historyFilters.limit !== 1 ? historyFilters.limit : "");
            const newUrl = `${url.pathname}${params.toString() ? `?${params.toString()}` : ""}${url.hash || ""}`;
            window.history.replaceState(null, "", newUrl);
        }

        function readHistoryFiltersFromUrl() {
            const params = new URLSearchParams(window.location.search);
            historyFilters = {
                metric_key: params.get("metric_key") || "",
                start_at: params.get("start_at") || "",
                end_at: params.get("end_at") || "",
                limit: normalizeHistoryLimit(params.get("limit") || "1"),
                offset: 0,
            };
        }

        function applyHistoryFiltersToUi() {
            const metricEl = document.getElementById("history-metric-key");
            const startEl = document.getElementById("history-start-at");
            const endEl = document.getElementById("history-end-at");
            const limitEl = document.getElementById("history-limit");
            if (metricEl) metricEl.value = historyFilters.metric_key || "";
            if (startEl) startEl.value = toLocalInputValue(historyFilters.start_at);
            if (endEl) endEl.value = toLocalInputValue(historyFilters.end_at);
            if (limitEl) limitEl.value = String(historyFilters.limit || 1);
        }

        function updateHistoryFilterStatus() {
            const statusEl = document.getElementById("history-filter-status");
            if (!statusEl) return;
            const parts = [];
            if (historyFilters.metric_key) parts.push(`metric_key=${historyFilters.metric_key}`);
            if (historyFilters.start_at) parts.push(`start_at=${historyFilters.start_at}`);
            if (historyFilters.end_at) parts.push(`end_at=${historyFilters.end_at}`);
            if (historyFilters.limit !== 1) parts.push(`limit=${historyFilters.limit}`);
            statusEl.textContent = parts.length ? `当前：${parts.join(" | ")}` : "当前：默认（最新 1 条）";
        }

        function collectHistoryFiltersFromUi() {
            const metric = document.getElementById("history-metric-key")?.value || "";
            const startLocal = document.getElementById("history-start-at")?.value || "";
            const endLocal = document.getElementById("history-end-at")?.value || "";
            const limitValue = Number(document.getElementById("history-limit")?.value || "1");
            historyFilters = {
                metric_key: metric,
                start_at: toUtcIsoOrEmpty(startLocal),
                end_at: toUtcIsoOrEmpty(endLocal),
                limit: normalizeHistoryLimit(limitValue),
                offset: 0,
            };
            updateHistoryFilterStatus();
        }

        function initHistoryFilterControls() {
            const applyBtn = document.getElementById("history-apply-btn");
            const resetBtn = document.getElementById("history-reset-btn");

            applyBtn?.addEventListener("click", async () => {
                collectHistoryFiltersFromUi();
                writeHistoryFiltersToUrl();
                await refreshAll();
            });

            resetBtn?.addEventListener("click", async () => {
                document.getElementById("history-metric-key").value = "";
                document.getElementById("history-start-at").value = "";
                document.getElementById("history-end-at").value = "";
                document.getElementById("history-limit").value = "1";
                collectHistoryFiltersFromUi();
                writeHistoryFiltersToUrl();
                await refreshAll();
            });

            readHistoryFiltersFromUrl();
            applyHistoryFiltersToUi();
            updateHistoryFilterStatus();
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        function formatUnit(unit) {
            const key = String(unit || "").toLowerCase();
            if (!key) return "";
            if (key === "percent") return "%";
            if (key === "count") return "次";
            if (key === "w") return "万";
            return unit;
        }

        function normalizeMetricDefs(metricDefs) {
            if (!Array.isArray(metricDefs)) return [];
            return metricDefs
                .filter(item => item && typeof item === "object")
                .map(item => ({
                    key: String(item.key || "").trim(),
                    label: String(item.label || item.key || "").trim(),
                    unit: String(item.unit || "").trim(),
                }))
                .filter(item => item.key);
        }

        function patchHistoryMetricOptionsFromServices() {
            const metricEl = document.getElementById("history-metric-key");
            if (!metricEl) return;
            const currentValue = metricEl.value;
            const allDefs = serviceRegistry.flatMap(item => normalizeMetricDefs(item.metric_defs));
            const options = [{ key: "", label: "全部" }];
            const used = new Set([""]);
            for (const def of allDefs) {
                if (used.has(def.key)) continue;
                const unitSuffix = formatUnit(def.unit);
                const source = serviceRegistry.find(item =>
                    normalizeMetricDefs(item.metric_defs).some(m => m.key === def.key)
                );
                const suffix = source ? `（${source.name}）` : "";
                options.push({
                    key: def.key,
                    label: `${def.key}${def.label ? ` - ${def.label}` : ""}${unitSuffix ? ` [${unitSuffix}]` : ""}${suffix}`,
                });
                used.add(def.key);
            }
            metricEl.innerHTML = options
                .map(item => `<option value="${escapeHtml(item.key)}">${escapeHtml(item.label)}</option>`)
                .join("");
            metricEl.value = options.some(item => item.key === currentValue) ? currentValue : "";
        }

        function renderServiceCardsSkeleton() {
            const container = document.getElementById("services-cards");
            if (!container) return;
            if (!serviceRegistry.length) {
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">暂无可用服务</span>
                            <span class="card-badge badge-warn">空</span>
                        </div>
                        <div class="service-card-content">
                            <div class="loading">服务注册表为空</div>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = serviceRegistry.map(service => `
                <div class="card" id="service-card-${escapeHtml(service.id)}">
                    <div class="card-header">
                        <span class="card-title">${escapeHtml(service.icon || "🧩")} ${escapeHtml(service.name || service.id)}</span>
                        <span class="card-badge badge-ok" id="service-badge-${escapeHtml(service.id)}">加载中</span>
                    </div>
                    <div class="service-card-content" id="service-content-${escapeHtml(service.id)}">
                        <div class="loading">正在查询 ${escapeHtml(service.name || service.id)} 额度</div>
                    </div>
                </div>
            `).join("");
        }

        async function syncServiceRegistry() {
            const resp = await fetch(`${API_BASE}/api/services`, {
                headers: { "Authorization": `Bearer ${authToken}` }
            });
            if (!resp.ok) {
                throw new Error(`服务注册表加载失败 (${resp.status})`);
            }
            const data = await resp.json();
            const latest = Array.isArray(data) ? data : [];
            const changed = JSON.stringify(latest.map(item => item.id)) !== JSON.stringify(serviceRegistry.map(item => item.id));
            serviceRegistry = latest;
            if (changed || !document.getElementById("service-content-" + (serviceRegistry[0]?.id || ""))) {
                renderServiceCardsSkeleton();
            }
            patchHistoryMetricOptionsFromServices();
        }

        async function loadAccountMapByService() {
            try {
                const resp = await fetch(`${API_BASE}/api/accounts`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!resp.ok) return {};
                const accounts = await resp.json();
                const map = {};
                for (const item of (Array.isArray(accounts) ? accounts : [])) {
                    if (item && item.service_id) {
                        map[item.service_id] = item;
                    }
                }
                return map;
            } catch {
                return {};
            }
        }

        function formatHistoryTime(value) {
            if (!value) return "-";
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return "-";
            return dt.toLocaleString("zh-CN", { hour12: false });
        }

        async function fetchLatestHistory(accountId, filters) {
            const search = new URLSearchParams({
                limit: String(filters?.limit || 1),
                offset: String(filters?.offset || 0),
            });
            if (filters?.metric_key) search.set("metric_key", filters.metric_key);
            if (filters?.start_at) search.set("start_at", filters.start_at);
            if (filters?.end_at) search.set("end_at", filters.end_at);

            const resp = await fetch(`${API_BASE}/api/accounts/${accountId}/history?${search.toString()}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (!resp.ok) {
                throw new Error(`history 请求失败 (${resp.status})`);
            }

            const data = await resp.json();
            const items = Array.isArray(data?.items) ? data.items : [];
            const pagination = data?.pagination || {};
            const parsedFilters = data?.filters || {};
            return {
                item: items[0] || null,
                pagination,
                filters: parsedFilters,
            };
        }

        /** FastAPI HTTPException / 旧版 body.error */
        function extractApiErrorMessage(data) {
            if (!data || typeof data !== "object") return "加载失败";
            if (typeof data.detail === "string") return data.detail;
            if (Array.isArray(data.detail)) {
                const parts = data.detail.map(e => (e && (e.msg || e.message)) || "").filter(Boolean);
                return parts.length ? parts.join(" ") : "请求无效";
            }
            if (data.error) return String(data.error);
            return "";
        }

        /** 卡片错误：未配置 Cookie 为橙色「未配置」，其余多为需登录或系统错误 */
        function renderServiceCardError(badge, content, message) {
            const msg = message || "加载失败";
            let badgeClass, badgeText;
            if (/解密失败|Decrypt/i.test(msg)) {
                badgeClass = "card-badge badge-error";
                badgeText = "错误";
            } else if (/请先设置|未配置 Cookie|Cookie 未配置|NO_COOKIE/i.test(msg)) {
                badgeClass = "card-badge badge-warn";
                badgeText = "未配置";
            } else {
                badgeClass = "card-badge badge-error";
                badgeText = "需登录";
            }
            badge.className = badgeClass;
            badge.textContent = badgeText;
            content.innerHTML = `
                <div class="login-box">
                    <p style="color: #888; font-size: 13px;">${msg}</p>
                    <p style="color: #666; font-size: 12px; margin-top: 10px;">请使用页面顶部「🔧 设置 Cookie」进行配置。</p>
                </div>
            `;
        }
        
        function getNumberValue(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : 0;
        }

        function buildUsageNumbers(data) {
            const pageInfo = data?.page_info || {};
            const used = getNumberValue(pageInfo.used ?? pageInfo.dailyUsed);
            const total = getNumberValue(pageInfo.total ?? pageInfo.dailyQuota);
            const remainFromPage = pageInfo.dailyRemain ?? pageInfo.remain;
            const remain = remainFromPage != null ? getNumberValue(remainFromPage) : Math.max(0, total - used);
            const percentRaw = pageInfo.percent ?? data?.percent;
            const percent = percentRaw != null ? getNumberValue(percentRaw) : (total > 0 ? (used / total) * 100 : 0);
            return {
                used,
                total,
                remain,
                percent,
                expiresAt: pageInfo.expiresAt || "-",
                resetHours: getNumberValue(pageInfo.resetHours),
                resetMinutes: getNumberValue(pageInfo.resetMinutes),
                raw: pageInfo,
            };
        }

        function pickMetricValue(metricKey, usage) {
            const key = String(metricKey || "").toLowerCase();
            if (!key) return null;
            if (key.includes("percent")) return usage.percent;
            if (key.includes("remain") || key.includes("left")) return usage.remain;
            if (key.includes("total") || key.includes("quota")) return usage.total;
            if (key.includes("used")) return usage.used;
            return null;
        }

        function formatMetricValue(value, unit, metricKey) {
            const numeric = getNumberValue(value);
            if (String(unit || "").toLowerCase() === "percent" || String(metricKey || "").toLowerCase().includes("percent")) {
                return `${numeric.toFixed(1)}%`;
            }
            const unitText = formatUnit(unit);
            if (!unitText) return `${numeric}`;
            return `${numeric} ${unitText}`.trim();
        }

        function buildMetricRows(service, data) {
            const usage = buildUsageNumbers(data);
            const defs = normalizeMetricDefs(service.metric_defs);
            const rows = [];
            for (const def of defs) {
                const value = pickMetricValue(def.key, usage);
                if (value == null) continue;
                rows.push({
                    label: def.label || def.key,
                    value: formatMetricValue(value, def.unit, def.key),
                });
            }
            if (!rows.length) {
                rows.push({ label: "已用", value: `${usage.used}` });
                rows.push({ label: "总量", value: `${usage.total}` });
                rows.push({ label: "剩余", value: `${usage.remain}` });
                rows.push({ label: "使用率", value: `${usage.percent.toFixed(1)}%` });
            }
            return { rows, usage };
        }

        function formatResetTime(resetHours, resetMinutes) {
            if (resetHours > 0 || resetMinutes > 0) {
                return `${resetHours || 0}小时${resetMinutes || 0}分钟`;
            }
            return "-";
        }

        async function refreshServiceCard(service, accountsByService = {}) {
            const badge = document.getElementById(`service-badge-${service.id}`);
            const content = document.getElementById(`service-content-${service.id}`);
            if (!badge || !content) return;

            try {
                const resp = await fetch(`${API_BASE}/api/${service.id}/`, {
                    headers: { "Authorization": `Bearer ${authToken}` }
                });
                const data = await resp.json();
                if (!resp.ok) {
                    renderServiceCardError(
                        badge,
                        content,
                        extractApiErrorMessage(data) || (`请求失败 (${resp.status})`)
                    );
                    return;
                }
                if (data.error) {
                    renderServiceCardError(badge, content, data.error);
                    return;
                }

                badge.className = "card-badge badge-ok";
                badge.textContent = "正常";

                const { rows, usage } = buildMetricRows(service, data);
                const percent = getNumberValue(usage.percent);
                const colorClass = percent > 80 ? "red" : percent > 50 ? "orange" : "green";
                const account = accountsByService[service.id];
                let historyInfo = { collectedAt: "-", metricKey: "-" };
                if (account?.id) {
                    try {
                        const history = await fetchLatestHistory(account.id, historyFilters);
                        if (history.item) {
                            historyInfo = {
                                collectedAt: formatHistoryTime(history.item.collected_at),
                                metricKey: history.item.metric_key || "-",
                            };
                        }
                    } catch {
                        // 历史查询失败不影响主流程展示
                    }
                }

                const metaRows = [
                    { label: "到期时间", value: usage.expiresAt || "-" },
                    { label: "重置时间", value: formatResetTime(usage.resetHours, usage.resetMinutes) },
                    { label: "最近采集", value: historyInfo.collectedAt },
                    { label: "历史指标", value: historyInfo.metricKey },
                ];

                content.innerHTML = `
                    <div class="card-stats-block">
                        ${rows.map(row => `
                            <div class="stat-row">
                                <span class="stat-label">${escapeHtml(row.label)}</span>
                                <span class="stat-value">${escapeHtml(row.value)}</span>
                            </div>
                        `).join("")}
                    </div>
                    <div class="card-meta-block">
                        ${metaRows.map((row, idx) => `
                            <div class="stat-row ${idx === 0 ? "meta-row-first" : ""}">
                                <span class="stat-label">${escapeHtml(row.label)}</span>
                                <span class="stat-value">${escapeHtml(row.value)}</span>
                            </div>
                        `).join("")}
                    </div>
                    <div class="card-progress-wrap">
                        <div class="progress-bar">
                            <div class="progress-fill ${colorClass}" style="width: ${Math.max(0, Math.min(100, percent))}%"></div>
                        </div>
                    </div>
                `;
            } catch (e) {
                badge.className = "card-badge badge-error";
                badge.textContent = "错误";
                content.innerHTML = `<div class="error-detail">${escapeHtml(e.message || "加载失败")}</div>`;
            }
        }
        
        function showLoginModal(service) {
            const modal = document.getElementById('login-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('modal-login-btn');
            
            if (service === 'minimax') {
                title.textContent = '需要登录 MiniMax';
                desc.textContent = '点击按钮前往 MiniMax 官网登录\n登录完成后返回即可';
                btn.onclick = () => { window.location.href = 'https://platform.minimaxi.com/user-center/payment/token-plan'; };
            } else if (service === 'xfyun') {
                title.textContent = '需要登录讯飞星辰';
                desc.textContent = '点击按钮前往讯飞登录\n登录完成后返回即可';
                btn.onclick = () => { window.location.href = 'https://maas.xfyun.cn/packageSubscription'; };
            }
            
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('login-modal').style.display = 'none';
        }
        
        // 首次加载 - 先检查登录状态
        initHistoryFilterControls();
        checkAuth().then(loggedIn => {
            if (loggedIn) {
                refreshAll();
            }
        });
        
        // 每60秒自动刷新
        setInterval(() => {
            if (authToken) refreshAll();
        }, 60000);
    </script>
</body>
</html>
