<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Token Monitor ✨</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --bg-dark: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.08);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #a8b0d3;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.3);
            --spacing-sm: 12px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-normal: 0.25s ease;
            --success-soft: rgba(76, 175, 80, 0.22);
            --success-border: rgba(76, 175, 80, 0.38);
            --success-text-on-tag: #c8e6c9;
            --alert-panel-bg: linear-gradient(145deg, rgba(102, 126, 234, 0.14) 0%, rgba(22, 33, 62, 0.92) 45%, rgba(255, 255, 255, 0.06) 100%);
            --alert-panel-border: rgba(102, 126, 234, 0.35);
            --font-section: 18px;
            --font-alert-line: 14px;
            --font-alert-meta: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        .header h1 { font-size: 28px; color: #e0e0e0; margin-bottom: 5px; font-weight: 500; }
        .header p { font-size: 12px; color: #888; }
        
        .dashboard-wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding-bottom: 56px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
            align-items: stretch;
        }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
        }

        .cards-grid:has(> :only-child) > .card {
            grid-column: 1 / -1;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card-title { font-size: 18px; font-weight: 500; }
        
        .card-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-ok {
            background: var(--success-soft);
            color: var(--success-text-on-tag);
            border: 1px solid var(--success-border);
            font-weight: 500;
        }
        .badge-error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .badge-warn { background: rgba(255, 152, 0, 0.2); color: #FF9800; }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.3;
        }
        .stat-value {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.3;
        }
        
        /* 卡片主体纵向排列；指标区为统一两列表格，数值列右对齐齐平 */
        .service-card-content {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
        }

        .card-dynamic {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .metric-sheet {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(6.75rem, max-content);
            column-gap: 16px;
            row-gap: 4px;
            align-items: center;
            width: 100%;
        }

        .metric-sheet .stat-label,
        .metric-sheet .stat-value {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .metric-sheet > *:nth-last-child(-n + 2) {
            border-bottom: none;
            padding-bottom: 8px;
        }

        .metric-sheet .stat-value {
            text-align: right;
            font-variant-numeric: tabular-nums;
            justify-self: end;
        }

        .metric-sheet .metric-before-meta {
            border-bottom: none;
            padding-bottom: 6px;
        }

        .metric-sheet .metric-meta-start {
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 12px;
            margin-top: 2px;
        }

        .card-progress-wrap {
            flex: 0 0 auto;
            width: 100%;
            min-width: 0;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        
        .progress-bar {
            flex: 1 1 auto;
            min-width: 0;
            height: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        /* 斜纹漂移 + 高光斜扫；绿 / 橙 / 红仅底色与外发光色相不同，动效相同 */
        .progress-fill {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s ease;
            min-width: 0;
        }

        .progress-fill::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: repeating-linear-gradient(
                122deg,
                transparent 0,
                transparent 10px,
                rgba(255, 255, 255, 0.04)       10px,
                rgba(255, 255, 255, 0.1) 12px,
                transparent                        12px,
                transparent                        24px
            );
            background-size: 36px 36px;
            animation: progress-wave-drift 5.5s linear infinite;
            pointer-events: none;
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            top: -15%;
            width: 55%;
            height: 130%;
            left: 0;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0)     0%,
                rgba(255, 255, 255, 0.09) 38%,
                rgba(255, 255, 255, 0.46) 50%,
                rgba(255, 255, 255, 0.1)  62%,
                rgba(255, 255, 255, 0)    100%
            );
            transform: translateX(-115%) skewX(-14deg);
            animation: progress-gloss-pass 2.85s cubic-bezier(0.42, 0.02, 0.58, 0.98) infinite;
            pointer-events: none;
            filter: blur(0.6px);
            mix-blend-mode: soft-light;
        }

        @keyframes progress-wave-drift {
            0% { background-position: 0 0; }
            100% { background-position: 36px 0; }
        }

        @keyframes progress-gloss-pass {
            0% {
                transform: translateX(-125%) skewX(-14deg);
                opacity: 0.5;
            }
            12% {
                opacity: 0.95;
            }
            88% {
                opacity: 0.95;
            }
            100% {
                transform: translateX(265%) skewX(-14deg);
                opacity: 0.5;
            }
        }

        .progress-fill.green {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
                linear-gradient(90deg, #145214 0%, #1b5e20 12%, #2e7d32 35%, #43a047 55%, #5faf62 78%, #2e7d32 100%);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -3px 6px rgba(0, 0, 0, 0.2);
        }

        .progress-fill.orange {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, transparent 36%),
                linear-gradient(90deg, #8d3800 0%, #bf360c 14%, #e65100 38%, #fb8c00 55%, #ffa726 80%, #ef6c00 100%);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -3px 6px rgba(0, 0, 0, 0.18);
        }

        .progress-fill.red {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, transparent 36%),
                linear-gradient(90deg, #5c0a0a 0%, #7f1010 12%, #b71c1c 35%, #e53935 55%, #ff6b6b 78%, #c62828 100%);
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 -3px 6px rgba(0, 0, 0, 0.22);
        }

        @media (prefers-reduced-motion: reduce) {
            .progress-fill::before,
            .progress-fill::after {
                animation: none;
                display: none;
            }
            .progress-fill.green {
                background: linear-gradient(90deg, #43a047, #8bc34a 55%, #c5e1a5);
                box-shadow: 0 0 12px rgba(76, 175, 80, 0.35);
            }
            .progress-fill.orange {
                background: linear-gradient(90deg, #fb8c00, #ffca28 60%, #fff176);
                box-shadow: 0 0 12px rgba(255, 152, 0, 0.32);
            }
            .progress-fill.red {
                background: linear-gradient(90deg, #e53935, #ff5252 55%, #ff8a80);
                box-shadow: 0 0 12px rgba(244, 67, 54, 0.35);
            }
        }

        .progress-pct {
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            min-width: 3.25rem;
            text-align: right;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .login-box {
            text-align: center;
            padding: 20px;
        }
        
        .error-detail {
            font-size: 12px;
            color: #f44336;
            margin-top: 8px;
            padding: 8px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 52px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .refresh-btn:active { transform: scale(0.95); }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .last-update {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        .refresh-feedback {
            text-align: center;
            font-size: 12px;
            color: #9aa3c7;
            min-height: 18px;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .refresh-feedback.error { color: #ff9aa2; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-content h3 { font-size: 18px; margin-bottom: 10px; color: #fff; }
        .modal-content p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        
        .modal-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.1); color: #888; }

        /** 监控页顶栏：设置凭证 / 管理后台 / 退出 同一套文字链风格 */
        .header-top-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .header-top-link:hover {
            color: #8b9cff;
        }

        .card-sparkline {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 84px;
        }

        .card-sparkline-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-sparkline-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .card-sparkline-chart {
            width: 100%;
            height: 52px;
            flex: 1;
            min-height: 48px;
        }

        .card-sparkline-chart .sparkline-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .sparkline-empty,
        .sparkline-loading {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            height: 100%;
            min-height: 40px;
        }

        .recent-alerts-panel {
            margin-top: 32px;
            background: var(--alert-panel-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl) var(--spacing-lg);
            border: 1px solid var(--alert-panel-border);
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow-card-hover);
        }

        .recent-alerts-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .recent-alerts-head-main {
            flex: 1;
            min-width: 0;
        }

        .recent-alerts-title {
            font-size: var(--font-section);
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.02em;
            line-height: 1.25;
            margin: 0;
        }

        .recent-alerts-more {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.22);
            border: 1px solid rgba(102, 126, 234, 0.45);
            color: #e8ecff;
            text-decoration: none;
        }

        .recent-alerts-more:hover {
            background: rgba(102, 126, 234, 0.38);
            color: #fff;
        }

        /* 可视高度由 JS 按真实 3 条高度写入；自动滚动，隐藏滚动条 */
        .recent-alerts-list {
            list-style: none;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding-right: 2px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .recent-alerts-list::-webkit-scrollbar {
            display: none;
        }

        .recent-alerts-list li {
            font-size: var(--font-alert-line);
            color: var(--text-secondary);
            line-height: 1.35;
            padding: 14px 12px;
            margin: 0 -6px;
            border-radius: var(--radius-md);
            border-bottom: none;
        }

        .recent-alerts-list li + li {
            margin-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .recent-alerts-list li:last-child {
            border-bottom: none;
        }

        .recent-alerts-list li:not(.recent-alerts-empty):hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .recent-alerts-list .recent-alert-time {
            color: var(--text-muted);
            font-size: var(--font-alert-meta);
            font-weight: 400;
        }

        .recent-alerts-list .recent-alert-svc {
            color: #a6b7ff;
            font-weight: 600;
        }

        .recent-alerts-empty {
            font-size: var(--font-alert-line);
            color: var(--text-muted);
            padding: 12px 8px;
            font-weight: 500;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Token Monitor</h1>
        <p>API 额度实时监控</p>
        <div id="user-info" style="margin-top: 10px; font-size: 12px; color: #888; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;"></div>
    </div>

    <div class="dashboard-wrap">
        <div class="cards-grid" id="services-cards">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">服务加载中</span>
                    <span class="card-badge badge-ok">初始化</span>
                </div>
                <div class="service-card-content">
                    <div class="loading">正在加载服务注册表</div>
                </div>
            </div>
        </div>

        <section class="recent-alerts-panel" id="recent-alerts-panel" aria-label="最近告警">
            <div class="recent-alerts-head">
                <div class="recent-alerts-head-main">
                    <h2 class="recent-alerts-title">📊 最近告警</h2>
                </div>
                <a href="accounts.html" class="header-top-link recent-alerts-more">查看全部</a>
            </div>
            <ul class="recent-alerts-list" id="recent-alerts-list">
                <li class="recent-alerts-empty">加载中…</li>
            </ul>
        </section>
    </div>
    
    <div class="last-update" id="last-update"></div>
    <div class="refresh-feedback" id="refresh-feedback"></div>
    
    <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">↻</button>
    
    <!-- 登录引导弹窗 -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">需要登录</h3>
            <p id="modal-desc">请点击下方按钮前往登录</p>
            <button class="modal-btn" id="modal-login-btn">去登录</button>
            <button class="modal-btn secondary" onclick="closeModal()">取消</button>
        </div>
    </div>
    
    <!-- 监控页脚本顺序：state → core → app（勿调序；详见各 js 文件头注释） -->
    <script src="js/api-dashboard-state.js"></script>
    <script src="js/api-dashboard-core.js"></script>
    <script src="js/api-dashboard-app.js"></script>
</body>
</html>
