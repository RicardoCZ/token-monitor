<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Token Monitor ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        .header h1 { font-size: 24px; color: #e0e0e0; margin-bottom: 5px; }
        .header p { font-size: 12px; color: #888; }
        
        .cards { max-width: 600px; margin: 0 auto; }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card-title { font-size: 18px; font-weight: 600; }
        
        .card-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .badge-ok { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .badge-error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .badge-warn { background: rgba(255, 152, 0, 0.2); color: #FF9800; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #999; font-size: 14px; }
        .stat-value { font-weight: 600; font-size: 14px; color: #fff; }
        
        /* 卡片主体纵向排列，进度条固定在所有文案块之后 */
        #minimax-content,
        #xfyun-content {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
        }
        
        .card-stats-block { flex: 0 0 auto; order: 0; }
        .card-meta-block { flex: 0 0 auto; order: 1; margin-top: 0; }
        .card-progress-wrap {
            flex: 0 0 auto;
            order: 2;
            width: 100%;
            margin-top: 12px;
        }
        
        .meta-row-first {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.green { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .progress-fill.orange { background: linear-gradient(90deg, #FF9800, #FFC107); }
        .progress-fill.red { background: linear-gradient(90deg, #f44336, #E91E63); }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .login-box {
            text-align: center;
            padding: 20px;
        }
        
        .error-detail {
            font-size: 12px;
            color: #f44336;
            margin-top: 8px;
            padding: 8px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .refresh-btn:active { transform: scale(0.95); }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .last-update {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 20px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-content h3 { font-size: 18px; margin-bottom: 10px; color: #fff; }
        .modal-content p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        
        .modal-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.1); color: #888; }

        /** 监控页顶栏：设置 Cookie / 管理后台 / 退出 同一套文字链风格 */
        .header-top-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .header-top-link:hover {
            color: #8b9cff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Token Monitor</h1>
        <p>API 额度实时监控</p>
        <div id="user-info" style="margin-top: 10px; font-size: 12px; color: #888; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;"></div>
    </div>
    
    <div class="cards">
        <!-- MiniMax Card -->
        <div class="card" id="minimax-card">
            <div class="card-header">
                <span class="card-title">🟠 MiniMax</span>
                <span class="card-badge badge-ok" id="minimax-badge">加载中</span>
            </div>
            <div id="minimax-content">
                <div class="loading">正在查询MiniMax额度</div>
            </div>
        </div>
        
        <!-- 讯飞 Card -->
        <div class="card" id="xfyun-card">
            <div class="card-header">
                <span class="card-title">🔵 讯飞星辰 MaaS</span>
                <span class="card-badge badge-ok" id="xfyun-badge">加载中</span>
            </div>
            <div id="xfyun-content">
                <div class="loading">正在查询讯飞额度</div>
            </div>
        </div>
    </div>
    
    <div class="last-update" id="last-update"></div>
    
    <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">↻</button>
    
    <!-- 登录引导弹窗 -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">需要登录</h3>
            <p id="modal-desc">请点击下方按钮前往登录</p>
            <button class="modal-btn" id="modal-login-btn">去登录</button>
            <button class="modal-btn secondary" onclick="closeModal()">取消</button>
        </div>
    </div>
    
    <script>
        // API 基础地址
        const API_BASE = window.location.origin;
        
        // 用户状态
        let currentUser = null;
        let authToken = localStorage.getItem('token');
        
        // 检查登录状态
        async function checkAuth() {
            const userInfo = document.getElementById('user-info');
            
            if (!authToken) {
                // 未登录，跳转到登录页
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                const resp = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (resp.ok) {
                    currentUser = await resp.json();
                    
                    // 管理员显示管理入口
                    let adminLink = '';
                    if (currentUser.role === 'admin') {
                        adminLink = '<a href="admin.html" class="header-top-link">⚙️ 管理后台</a>';
                    }
                    
                    userInfo.innerHTML = `
                        <span>👤 ${currentUser.username}</span>
                        <a href="setup.html" class="header-top-link">🔧 设置 Cookie</a>
                        ${adminLink}
                        <span class="header-top-link" style="cursor: pointer;" role="button" tabindex="0" onclick="logout()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();logout();}">退出</span>
                    `;
                    return true;
                } else {
                    // Token 无效
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return false;
                }
            } catch (e) {
                console.error('Auth check failed:', e);
                return false;
            }
        }
        
        // 登出
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        async function refreshAll() {
            const btn = document.getElementById("refresh-btn");
            btn.classList.add("spinning");
            
            await Promise.all([refreshMinimax(), refreshXfyun()]);
            
            document.getElementById("last-update").textContent = 
                "最后更新: " + new Date().toLocaleTimeString("zh-CN");
            
            btn.classList.remove("spinning");
        }

        /** FastAPI HTTPException / 旧版 body.error */
        function extractApiErrorMessage(data) {
            if (!data || typeof data !== "object") return "加载失败";
            if (typeof data.detail === "string") return data.detail;
            if (Array.isArray(data.detail)) {
                const parts = data.detail.map(e => (e && (e.msg || e.message)) || "").filter(Boolean);
                return parts.length ? parts.join(" ") : "请求无效";
            }
            if (data.error) return String(data.error);
            return "";
        }

        /** 卡片错误：未配置 Cookie 为橙色「未配置」，其余多为需登录或系统错误 */
        function renderServiceCardError(badge, content, message) {
            const msg = message || "加载失败";
            let badgeClass, badgeText;
            if (/解密失败|Decrypt/i.test(msg)) {
                badgeClass = "card-badge badge-error";
                badgeText = "错误";
            } else if (/请先设置|未配置 Cookie|Cookie 未配置|NO_COOKIE/i.test(msg)) {
                badgeClass = "card-badge badge-warn";
                badgeText = "未配置";
            } else {
                badgeClass = "card-badge badge-error";
                badgeText = "需登录";
            }
            badge.className = badgeClass;
            badge.textContent = badgeText;
            content.innerHTML = `
                <div class="login-box">
                    <p style="color: #888; font-size: 13px;">${msg}</p>
                    <p style="color: #666; font-size: 12px; margin-top: 10px;">请使用页面顶部「🔧 设置 Cookie」进行配置。</p>
                </div>
            `;
        }
        
        async function refreshMinimax() {
            const badge = document.getElementById("minimax-badge");
            const content = document.getElementById("minimax-content");
            
            try {
                // 获取存储的页面数据
                let resp = await fetch(`${API_BASE}/api/minimax/`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                let data = await resp.json();
                
                if (!resp.ok) {
                    renderServiceCardError(
                        badge,
                        content,
                        extractApiErrorMessage(data) || ("请求失败 (" + resp.status + ")")
                    );
                    return;
                }

                if (data.error) {
                    renderServiceCardError(badge, content, data.error);
                    return;
                }
                
                badge.className = "card-badge badge-ok";
                badge.textContent = "正常";
                
                // 使用页面数据
                const pageInfo = data.page_info || {};
                const used = pageInfo.used || 0;
                const total = pageInfo.total || 0;
                const remain = total - used;
                const percent = pageInfo.percent || '0';
                const expiresAt = pageInfo.expiresAt || '-';
                const resetMinutes = pageInfo.resetMinutes;
                const resetHours = pageInfo.resetHours;
                
                let resetTime = '-';
                if (resetHours > 0 || resetMinutes > 0) {
                    resetTime = (resetHours || 0) + '小时' + (resetMinutes || 0) + '分钟';
                }
                
                const colorClass = percent > 80 ? "red" : percent > 50 ? "orange" : "green";
                
                content.innerHTML = `
                    <div class="card-stats-block">
                        <div class="stat-row">
                            <span class="stat-label">Token Plan</span>
                            <span class="stat-value">${total} 次/5小时</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">已使用</span>
                            <span class="stat-value">${used} 次</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">剩余</span>
                            <span class="stat-value">${remain} 次</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">使用率</span>
                            <span class="stat-value">${percent}%</span>
                        </div>
                    </div>
                    <div class="card-meta-block">
                        <div class="stat-row meta-row-first">
                            <span class="stat-label">到期时间</span>
                            <span class="stat-value">${expiresAt}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">重置时间</span>
                            <span class="stat-value">${resetTime}</span>
                        </div>
                    </div>
                    <div class="card-progress-wrap">
                        <div class="progress-bar">
                            <div class="progress-fill ${colorClass}" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
                
            } catch (e) {
                badge.className = "card-badge badge-error";
                badge.textContent = "错误";
                content.innerHTML = `<div class="error-detail">${e.message}</div>`;
            }
        }
        
        async function refreshXfyun() {
            const badge = document.getElementById("xfyun-badge");
            const content = document.getElementById("xfyun-content");
            
            try {
                let resp = await fetch(`${API_BASE}/api/xfyun/`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                let data = await resp.json();
                
                if (!resp.ok) {
                    renderServiceCardError(
                        badge,
                        content,
                        extractApiErrorMessage(data) || ("请求失败 (" + resp.status + ")")
                    );
                    return;
                }

                if (data.error) {
                    renderServiceCardError(badge, content, data.error);
                    return;
                }
                
                badge.className = "card-badge badge-ok";
                badge.textContent = "正常";
                
                // 使用页面数据
                const pageInfo = data.page_info || {};
                const dailyQuota = pageInfo.dailyQuota || 0;
                const dailyUsed = pageInfo.dailyUsed || 0;
                const dailyRemain = pageInfo.dailyRemain || 0;
                const percent = data.percent || (dailyQuota > 0 ? (dailyUsed / dailyQuota * 100).toFixed(1) : 0);
                const expiresAt = pageInfo.expiresAt || '-';
                
                const colorClass = percent > 80 ? "red" : percent > 50 ? "orange" : "green";
                
                content.innerHTML = `
                    <div class="card-stats-block">
                        <div class="stat-row">
                            <span class="stat-label">日限额</span>
                            <span class="stat-value">${dailyQuota} 万 tokens</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">已用</span>
                            <span class="stat-value">${dailyUsed} 万</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">剩余</span>
                            <span class="stat-value">${dailyRemain} 万</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">使用率</span>
                            <span class="stat-value">${percent}%</span>
                        </div>
                    </div>
                    <div class="card-meta-block">
                        <div class="stat-row meta-row-first">
                            <span class="stat-label">到期时间</span>
                            <span class="stat-value">${expiresAt}</span>
                        </div>
                    </div>
                    <div class="card-progress-wrap">
                        <div class="progress-bar">
                            <div class="progress-fill ${colorClass}" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
                
            } catch (e) {
                badge.className = "card-badge badge-error";
                badge.textContent = "错误";
                content.innerHTML = `<div class="error-detail">${e.message}</div>`;
            }
        }
        
        function showLoginModal(service) {
            const modal = document.getElementById('login-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('modal-login-btn');
            
            if (service === 'minimax') {
                title.textContent = '需要登录 MiniMax';
                desc.textContent = '点击按钮前往 MiniMax 官网登录\n登录完成后返回即可';
                btn.onclick = () => { window.location.href = 'https://platform.minimaxi.com/user-center/payment/token-plan'; };
            } else if (service === 'xfyun') {
                title.textContent = '需要登录讯飞星辰';
                desc.textContent = '点击按钮前往讯飞登录\n登录完成后返回即可';
                btn.onclick = () => { window.location.href = 'https://maas.xfyun.cn/packageSubscription'; };
            }
            
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('login-modal').style.display = 'none';
        }
        
        // 首次加载 - 先检查登录状态
        checkAuth().then(loggedIn => {
            if (loggedIn) {
                refreshAll();
            }
        });
        
        // 每60秒自动刷新
        setInterval(() => {
            if (authToken) refreshAll();
        }, 60000);
    </script>
</body>
</html>
