<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Token Monitor - 历史趋势</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --bg-dark: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.08);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #a8b0d3;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius-md: 12px;
            --radius-lg: 16px;
            --spacing-lg: 24px;
            --transition-normal: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
        }

        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 28px; font-weight: 500; color: #e0e0e0; margin-bottom: 5px; }
        .header p { font-size: 12px; color: var(--text-muted); }

        .header-top-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        .header-top-link:hover { color: #8b9cff; }

        .cards { max-width: 900px; margin: 0 auto; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title { font-size: 18px; font-weight: 600; }

        .history-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .history-select {
            min-width: 140px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            font-size: 12px;
        }

        .history-select option {
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        .history-range-btn {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            color: #cfd6f4;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .history-range-btn.active {
            background: rgba(102, 126, 234, 0.35);
            color: var(--text-primary);
            border-color: rgba(102, 126, 234, 0.75);
        }

        .history-chart {
            width: 100%;
            height: 360px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.03);
        }

        .history-status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 16px;
        }

        .refresh-row {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
        }

        .refresh-btn {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(102, 126, 234, 0.24);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background var(--transition-normal), border-color var(--transition-normal),
                transform 0.15s ease;
        }

        .refresh-btn:hover {
            background: rgba(102, 126, 234, 0.38);
            border-color: rgba(102, 126, 234, 0.45);
        }

        .refresh-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 历史趋势</h1>
        <p>按账号查看 24h/7d 用量变化</p>
        <div id="user-info" style="margin-top: 10px; font-size: 12px; color: #888; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;"></div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-header">
                <span class="card-title">历史用量曲线</span>
            </div>
            <div class="history-toolbar">
                <select id="history-account-select" class="history-select"></select>
                <button id="history-range-24h" class="history-range-btn active" type="button">24h</button>
                <button id="history-range-7d" class="history-range-btn" type="button">7d</button>
            </div>
            <div id="history-chart" class="history-chart"></div>
            <div id="history-status" class="history-status"></div>
            <div class="refresh-row">
                <button id="history-refresh-btn" class="refresh-btn" type="button">刷新历史数据</button>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"
        integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    ></script>
    <script>
        if (!window.echarts) {
            const fallback = document.createElement("script");
            fallback.src = "https://unpkg.com/echarts@5.5.1/dist/echarts.min.js";
            fallback.crossOrigin = "anonymous";
            fallback.referrerPolicy = "no-referrer";
            document.head.appendChild(fallback);
        }
    </script>
    <script src="js/api-dashboard-state.js"></script>
    <script src="js/api-dashboard-core.js"></script>
    <script>
        const U = window.TMDCore;
        const API_BASE = window.location.origin;
        const CURRENT_PAGE = (window.location.pathname.split('/').pop() || 'history.html').toLowerCase();

        let authToken = localStorage.getItem("token");
        let currentUser = null;
        const state = {
            accounts: [],
            accountId: null,
            range: "24h",
            chart: null,
            isLoading: false,
        };

        const escapeHtml = (text) => U.escapeHtml(text);

        function setHistoryStatus(text, isError = false) {
            const el = document.getElementById("history-status");
            if (!el) return;
            el.textContent = text || "";
            el.style.color = isError ? "#ff9aa2" : "#98a2c8";
        }

        function buildTopNavLinks(isAdmin) {
            const links = [
                { path: 'api.html', label: '📊 实时监控' },
                { path: 'history.html', label: '📈 历史趋势' },
                { path: 'setup.html', label: '🔧 设置凭证' },
                { path: 'accounts.html', label: '🧾 账号管理' },
            ];
            if (isAdmin) {
                links.push({ path: 'admin.html', label: '⚙️ 管理后台' });
            }
            return links
                .filter(item => item.path.toLowerCase() !== CURRENT_PAGE)
                .map(item => `<a href="${item.path}" class="header-top-link">${item.label}</a>`)
                .join('');
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        async function checkAuth() {
            if (!authToken) {
                window.location.href = "login.html";
                return false;
            }
            try {
                const resp = await fetch(`${API_BASE}/auth/me`, {
                    headers: { "Authorization": `Bearer ${authToken}` },
                });
                if (!resp.ok) {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    window.location.href = "login.html";
                    return false;
                }
                currentUser = await resp.json();
                const userInfo = document.getElementById("user-info");
                userInfo.innerHTML = `
                    <span>👤 ${escapeHtml(currentUser.username)}</span>
                    ${buildTopNavLinks(currentUser.role === "admin")}
                    <span class="header-top-link" style="cursor: pointer;" role="button" tabindex="0" onclick="logout()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();logout();}">退出</span>
                `;
                return true;
            } catch (e) {
                setHistoryStatus("登录态检查失败，请稍后重试。", true);
                return false;
            }
        }

        const extractApiErrorMessage = (data) => U.extractApiErrorMessage(data);
        const getNullableNumber = (value) => U.getNullableNumber(value);

        function formatStatusRangeDate(d) {
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            const h = String(d.getHours()).padStart(2, "0");
            const min = String(d.getMinutes()).padStart(2, "0");
            return `${m}-${day} ${h}:${min}`;
        }

        /**
         * 查询窗口内，本地时间下“有至少一个数据点”的小时数；
         * 分母为窗口时长（毫秒）折合小时数，向上取整，至少为 1。
         */
        function computeHourlyCoverage(items, windowStartMs, windowEndMs) {
            let totalSlots = 1;
            if (Number.isFinite(windowStartMs) && Number.isFinite(windowEndMs)) {
                const span = Math.max(0, windowEndMs - windowStartMs);
                totalSlots = Math.max(1, Math.ceil(span / 3600000));
            }
            if (!items.length) {
                return { covered: 0, totalSlots, pct: 0 };
            }
            const hoursWithData = new Set();
            const winOk = Number.isFinite(windowStartMs) && Number.isFinite(windowEndMs);
            for (const item of items) {
                if (!item || !item.collected_at) continue;
                const t = new Date(item.collected_at).getTime();
                if (!Number.isFinite(t)) continue;
                if (winOk && (t < windowStartMs || t > windowEndMs)) continue;
                const d = new Date(t);
                const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}`;
                hoursWithData.add(key);
            }
            const covered = hoursWithData.size;
            const pct = totalSlots > 0 ? Math.round((covered / totalSlots) * 100) : 0;
            return { covered, totalSlots, pct };
        }

        function initChart() {
            const chartEl = document.getElementById("history-chart");
            if (!chartEl) return null;
            if (!window.echarts) {
                setHistoryStatus("图表库加载失败，无法渲染历史趋势。", true);
                chartEl.innerHTML = '<div style="padding: 140px 0; text-align:center; color:#7f8ab3;">图表组件不可用</div>';
                return null;
            }
            if (!state.chart) {
                state.chart = window.echarts.init(chartEl);
                window.addEventListener("resize", () => {
                    if (state.chart) state.chart.resize();
                });
            }
            return state.chart;
        }

        function markRangeButtons() {
            const btn24 = document.getElementById("history-range-24h");
            const btn7d = document.getElementById("history-range-7d");
            if (btn24) btn24.classList.toggle("active", state.range === "24h");
            if (btn7d) btn7d.classList.toggle("active", state.range === "7d");
        }

        async function loadAccounts() {
            const resp = await fetch(`${API_BASE}/api/accounts?_=${Date.now()}`, {
                cache: "no-store",
                headers: {
                    "Authorization": `Bearer ${authToken}`,
                    "Cache-Control": "no-cache",
                    Pragma: "no-cache",
                },
            });
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(extractApiErrorMessage(data) || `账号列表加载失败 (${resp.status})`);
            }
            state.accounts = Array.isArray(data) ? data : [];
            const select = document.getElementById("history-account-select");
            if (!select) return;
            if (!state.accounts.length) {
                select.innerHTML = '<option value="">暂无账号</option>';
                state.accountId = null;
                setHistoryStatus("暂无可用账号，请先到账号管理页配置。");
                return;
            }
            select.innerHTML = state.accounts
                .map(item => `<option value="${item.id}">${escapeHtml(item.service_name || item.service_id)} · ${escapeHtml(item.name || ("账号#" + item.id))}</option>`)
                .join("");
            state.accountId = state.accounts[0].id;
            select.value = String(state.accountId);
        }

        async function fetchHistoryItems(accountId, range) {
            const endMs = Date.now();
            const windowMs =
                range === "7d" ? 7 * 24 * 60 * 60 * 1000 : 24 * 60 * 60 * 1000;
            const startIso = new Date(endMs - windowMs).toISOString();
            const endIso = new Date(endMs).toISOString();
            const startAt = encodeURIComponent(startIso);
            const endAt = encodeURIComponent(endIso);
            const MAX_FETCH_PAGES = 30;
            const MAX_POINTS = 3000;
            const limit = 200;
            const all = [];
            let offset = 0;
            const bust = Date.now();
            for (let i = 0; i < MAX_FETCH_PAGES && all.length < MAX_POINTS; i += 1) {
                const url =
                    `${API_BASE}/api/accounts/${accountId}/history?limit=${limit}&offset=${offset}`  +
                    `&start_at=${startAt}&end_at=${endAt}&_=${bust}&p=${i}`;
                const resp = await fetch(url, {
                    cache: "no-store",
                    headers: {
                        "Authorization": `Bearer ${authToken}`,
                        "Cache-Control": "no-cache",
                        Pragma: "no-cache",
                    },
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(extractApiErrorMessage(data) || `历史数据加载失败 (${resp.status})`);
                }
                const items = Array.isArray(data.items) ? data.items : [];
                all.push(...items);
                if (!data.pagination?.has_more || !items.length) break;
                offset += limit;
            }
            const normalized = all
                .filter(item => item && item.collected_at)
                .sort((a, b) => new Date(a.collected_at).getTime() - new Date(b.collected_at).getTime());
            const truncated = normalized.length > MAX_POINTS;
            return {
                items: truncated ? normalized.slice(normalized.length - MAX_POINTS) : normalized,
                truncated,
                windowStartIso: startIso,
                windowEndIso: endIso,
            };
        }

        function renderChart(items, windowStartIso, windowEndIso) {
            const chart = initChart();
            if (!chart) return;

            const winStart = windowStartIso ? new Date(windowStartIso).getTime() : null;
            const winEnd = windowEndIso ? new Date(windowEndIso).getTime() : null;

            const dataP = [];
            const dataU = [];
            for (const item of items) {
                if (!item || !item.collected_at) continue;
                const t = item.collected_at;
                const pv = getNullableNumber(item.percent);
                const uv = getNullableNumber(item.used);
                dataP.push([t, pv]);
                dataU.push([t, uv]);
            }

            chart.setOption(
                {
                    backgroundColor: "transparent",
                    legend: {
                        data: ["使用率 %", "已用量"],
                        textStyle: { color: "#93a0cb", fontSize: 11 },
                        top: 0,
                    },
                    tooltip: {
                        trigger: "axis",
                        axisPointer: { type: "cross" },
                    },
                    grid: { left: 52, right: 56, top: 36, bottom: 52 },
                    xAxis: {
                        type: "time",
                        min: Number.isFinite(winStart) ? winStart : undefined,
                        max: Number.isFinite(winEnd) ? winEnd : undefined,
                        boundaryGap: false,
                        axisLabel: { color: "#93a0cb", fontSize: 10 },
                        axisLine: { lineStyle: { color: "rgba(255,255,255,0.2)" } },
                        splitLine: { show: false },
                    },
                    yAxis: [
                        {
                            type: "value",
                            name: "percent",
                            min: 0,
                            max: 100,
                            axisLabel: {
                                color: "#8b9cff",
                                fontSize: 10,
                                formatter: "{value}%",
                            },
                            nameTextStyle: { color: "#8b9cff", fontSize: 10 },
                            splitLine: { lineStyle: { color: "rgba(255,255,255,0.08)" } },
                        },
                        {
                            type: "value",
                            name: "used",
                            axisLabel: { color: "#e8a87c", fontSize: 10 },
                            nameTextStyle: { color: "#e8a87c", fontSize: 10 },
                            splitLine: { show: false },
                        },
                    ],
                    dataZoom: [
                        { type: "inside", xAxisIndex: 0 },
                        {
                            type: "slider",
                            xAxisIndex: 0,
                            height: 14,
                            bottom: 10,
                            borderColor: "rgba(255,255,255,0.18)",
                        },
                    ],
                    series: [
                        {
                            id: "percent",
                            name: "使用率 %",
                            type: "line",
                            yAxisIndex: 0,
                            connectNulls: false,
                            smooth: true,
                            symbol: "none",
                            lineStyle: { width: 2, color: "#6f88ff" },
                            itemStyle: { color: "#6f88ff" },
                            areaStyle: { opacity: 0.08, color: "#6f88ff" },
                            data: dataP,
                        },
                        {
                            id: "used",
                            name: "已用量",
                            type: "line",
                            yAxisIndex: 1,
                            connectNulls: false,
                            smooth: true,
                            symbol: "none",
                            lineStyle: { width: 2, color: "#e8a87c" },
                            itemStyle: { color: "#e8a87c" },
                            data: dataU,
                        },
                    ],
                },
                { notMerge: true }
            );
        }

        function getCurrentAccount() {
            return state.accounts.find(item => String(item.id) === String(state.accountId));
        }

        async function refreshHistory() {
            if (!state.accountId || state.isLoading) return;
            const account = getCurrentAccount();
            if (!account) return;

            const refreshBtn = document.getElementById("history-refresh-btn");
            state.isLoading = true;
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.textContent = "加载中...";
            }
            setHistoryStatus("正在加载历史数据...");
            try {
                const result = await fetchHistoryItems(state.accountId, state.range);
                const items = result.items;
                const wsMs = result.windowStartIso ? new Date(result.windowStartIso).getTime() : NaN;
                const weMs = result.windowEndIso ? new Date(result.windowEndIso).getTime() : NaN;
                if (!items.length) {
                    setHistoryStatus(
                        `${escapeHtml(account.name || ("账号#" + account.id))} · ${state.range} · 暂无数据点`
                    );
                    renderChart([], result.windowStartIso, result.windowEndIso);
                    return;
                }
                renderChart(items, result.windowStartIso, result.windowEndIso);
                const firstT = new Date(items[0].collected_at);
                const lastT = new Date(items[items.length - 1].collected_at);
                const actualFrom = formatStatusRangeDate(firstT);
                const actualTo = formatStatusRangeDate(lastT);
                const cov = computeHourlyCoverage(items, wsMs, weMs);
                const truncatedText = result.truncated ? " · 数据较多已截取最近部分" : "";
                setHistoryStatus(
                    `${escapeHtml(account.name || ("账号#" + account.id))} · ${state.range} · ${items.length} 条` +
                        `${truncatedText} · 实际范围: ${actualFrom} - ${actualTo} · ` +
                        `覆盖率: ${cov.covered}/${cov.totalSlots} 小时 (${cov.pct}%)`
                );
            } catch (e) {
                setHistoryStatus(e.message || "历史趋势加载失败", true);
            } finally {
                state.isLoading = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = "刷新历史数据";
                }
            }
        }

        function bindEvents() {
            const select = document.getElementById("history-account-select");
            const btn24 = document.getElementById("history-range-24h");
            const btn7d = document.getElementById("history-range-7d");
            const refreshBtn = document.getElementById("history-refresh-btn");

            if (select) {
                select.addEventListener("change", () => {
                    state.accountId = select.value;
                    refreshHistory();
                });
            }
            if (btn24) {
                btn24.addEventListener("click", () => {
                    state.range = "24h";
                    markRangeButtons();
                    refreshHistory();
                });
            }
            if (btn7d) {
                btn7d.addEventListener("click", () => {
                    state.range = "7d";
                    markRangeButtons();
                    refreshHistory();
                });
            }
            if (refreshBtn) {
                refreshBtn.addEventListener("click", () => refreshHistory());
            }
        }

        async function init() {
            const ok = await checkAuth();
            if (!ok) return;
            bindEvents();
            markRangeButtons();
            initChart();
            try {
                await loadAccounts();
                if (state.accountId) await refreshHistory();
            } catch (e) {
                setHistoryStatus(e.message || "初始化失败", true);
            }
        }

        init();
    </script>
</body>
</html>
