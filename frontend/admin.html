<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 令牌监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg-dark: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.08);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #a8b0d3;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius-lg: 16px;
            --transition-normal: 0.25s ease;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .header p {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        
        .header-top-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .header-top-link:hover {
            color: #8b9cff;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-card);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card-hover);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #999;
            font-size: 14px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-shadow: none;
            transition: none;
        }
        
        .form-group select {
            background-color: rgba(255, 255, 255, 0.1);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .form-group select option {
            background-color: #2a2a4a;
            color: #fff;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: none;
        }

        .form-group select:active {
            outline: none;
            border-color: #667eea;
            box-shadow: none;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .custom-select {
            position: relative;
            width: 100%;
            user-select: none;
        }
        .custom-select-trigger {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            position: relative;
        }
        .custom-select-trigger::after {
            content: "▾";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8b0d3;
            font-size: 12px;
        }
        .custom-select.open .custom-select-trigger {
            border-color: #667eea;
        }
        .custom-select-options {
            list-style: none;
            margin: 6px 0 0 0;
            padding: 6px;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            z-index: 20;
            border-radius: 10px;
            background: rgba(30, 34, 58, 0.98);
            border: 1px solid rgba(102, 126, 234, 0.35);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            display: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .custom-select.open .custom-select-options {
            display: block;
        }
        .custom-select-options li {
            padding: 10px 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #dbe3ff;
            cursor: pointer;
        }
        .custom-select-options li:hover {
            background: rgba(102, 126, 234, 0.22);
        }
        .custom-select-options li.active {
            background: rgba(102, 126, 234, 0.35);
            color: #fff;
        }
        .native-select-hidden {
            display: none !important;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.danger {
            background: rgba(244, 67, 54, 0.9);
        }

        .btn.small {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 6px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th {
            color: #888;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        td {
            font-size: 14px;
        }
        
        .code {
            font-family: monospace;
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            color: #667eea;
        }
        
        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .status.unused {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        
        .status.used {
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }
        
        .status.expired {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        .key-once {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
        }

        .key-once .code {
            display: inline-block;
            margin: 8px 0;
            word-break: break-all;
        }

        .sub-title {
            color: #a8b0d3;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .inline-fields {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .inline-fields .form-group {
            min-width: 0;
        }

        .small-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .mini-table th,
        .mini-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .toast.error {
            background: rgba(244, 67, 54, 0.9);
        }
        
        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 管理后台</h1>
            <div id="user-info" style="margin-top: 10px; font-size: 12px; color: #888; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;"></div>
        </div>
        
        <!-- 创建邀请码 -->
        <div class="card">
            <h2>🎫 创建邀请码</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>使用次数</label>
                    <input id="max-uses" type="hidden" value="1">
                    <div class="custom-select" id="custom-max-uses">
                        <div class="custom-select-trigger" id="custom-max-uses-trigger">1 次</div>
                        <ul class="custom-select-options" id="custom-max-uses-options">
                            <li data-value="1" class="active">1 次</li>
                            <li data-value="5">5 次</li>
                            <li data-value="10">10 次</li>
                            <li data-value="50">50 次</li>
                            <li data-value="100">100 次</li>
                            <li data-value="0">无限次</li>
                        </ul>
                    </div>
                </div>
                <button id="invite-btn" class="btn" onclick="createInviteCode()">生成邀请码</button>
            </div>
        </div>
        
        <!-- 邀请码列表 -->
        <div class="card">
            <h2>📋 邀请码列表</h2>
            <div class="form-row" style="margin-bottom: 10px;">
                <div class="form-group" style="max-width: 180px;">
                    <label>状态筛选</label>
                    <select id="invite-status-filter" onchange="changeInviteFilter(this.value)">
                        <option value="all">全部</option>
                        <option value="available">可用</option>
                        <option value="used">已用完</option>
                    </select>
                </div>
                <div style="flex: 1;"></div>
            </div>
            <div id="codes-list">
                <div class="empty">加载中...</div>
            </div>
            <div id="codes-pagination" class="small-note" style="margin-top: 8px;"></div>
        </div>

        <!-- 接口密钥管理 -->
        <div class="card">
            <h2>🔑 接口密钥管理</h2>
            <p class="hint">明文密钥只会在创建或轮换时展示一次，请立即复制保存。</p>
            <div class="form-row">
                <div class="form-group">
                    <label>名称</label>
                    <input id="api-key-name" type="text" placeholder="例如：运维脚本密钥">
                </div>
                <div class="form-group">
                    <label>权限范围（逗号分隔）</label>
                    <input id="api-key-scopes" type="text" placeholder="cookie:read,cookie:write">
                </div>
                <div class="form-group">
                    <label>过期时间（可选）</label>
                    <input id="api-key-expires" type="datetime-local">
                </div>
                <button id="api-key-create-btn" class="btn" onclick="createApiKey()">创建密钥</button>
            </div>
            <div id="api-key-once" class="key-once" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>🗂️ 接口密钥列表</h2>
            <div id="api-keys-list">
                <div class="empty">加载中...</div>
            </div>
        </div>

    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_BASE = window.location.origin;
        const CURRENT_PAGE = (window.location.pathname.split('/').pop() || 'admin.html').toLowerCase();
        let authToken = localStorage.getItem('token');
        let currentUser = null;
        let inviteCodesCache = [];
        let inviteStatusFilter = 'all';
        let inviteCurrentPage = 1;
        const INVITE_PAGE_SIZE = 5;

        function getAuthHeaders() {
            return { 'Authorization': `Bearer ${authToken}` };
        }

        function getJsonHeaders() {
            return {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function buildTopNavLinks() {
            const links = [
                { path: 'api.html', label: '📊 实时监控' },
                { path: 'history.html', label: '📈 历史趋势' },
                { path: 'setup.html', label: '🔧 设置凭证' },
                { path: 'accounts.html', label: '🧾 账号管理' },
                { path: 'admin.html', label: '⚙️ 管理后台' },
            ];
            return links
                .filter(item => item.path.toLowerCase() !== CURRENT_PAGE)
                .map(item => `<a href="${item.path}" class="header-top-link">${item.label}</a>`)
                .join('');
        }
        
        // 检查登录状态和管理员权限
        async function checkAuth() {
            if (!authToken) {
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                const resp = await fetch(`${API_BASE}/auth/me`, {
                    headers: getAuthHeaders()
                });
                
                if (resp.ok) {
                    currentUser = await resp.json();
                    
                    if (currentUser.role !== 'admin') {
                        showToast('需要管理员权限', true);
                        setTimeout(() => {
                            window.location.href = 'api.html';
                        }, 1500);
                        return false;
                    }
                    
                    document.getElementById('user-info').innerHTML = `
                        <span>👤 ${escapeHtml(currentUser.username)}</span>
                        ${buildTopNavLinks()}
                        <span class="header-top-link" style="cursor: pointer;" role="button" tabindex="0" onclick="logout()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();logout();}">退出</span>
                    `;
                    
                    return true;
                } else {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return false;
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
                return false;
            }
        }
        
        // 创建邀请码
        async function createInviteCode() {
            const maxUses = document.getElementById('max-uses').value;
            const btn = document.getElementById('invite-btn');
            
            btn.disabled = true;
            btn.textContent = '生成中...';
            
            try {
                const body = {
                    max_uses: parseInt(maxUses)
                };
                
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    method: 'POST',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(body)
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    showToast(`邀请码已创建: ${data.code}`);
                    loadInviteCodes();
                } else {
                    showToast(data.detail || '创建失败', true);
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成邀请码';
            }
        }

        function initCustomMaxUsesSelect() {
            const root = document.getElementById('custom-max-uses');
            const trigger = document.getElementById('custom-max-uses-trigger');
            const options = document.getElementById('custom-max-uses-options');
            const hidden = document.getElementById('max-uses');
            if (!root || !trigger || !options || !hidden) return;

            const close = () => root.classList.remove('open');
            const open = () => root.classList.add('open');
            const toggle = () => root.classList.toggle('open');

            const setValue = (value, text) => {
                hidden.value = String(value || '1');
                trigger.textContent = text || '1 次';
                options.querySelectorAll('li').forEach(li => {
                    li.classList.toggle('active', li.getAttribute('data-value') === hidden.value);
                });
            };

            trigger.addEventListener('click', (event) => {
                event.stopPropagation();
                toggle();
            });

            options.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setValue(li.getAttribute('data-value') || '1', li.textContent || '1 次');
                    close();
                });
            });

            document.addEventListener('click', (event) => {
                if (!root.contains(event.target)) close();
            });

            const initial = hidden.value || '1';
            const initialItem = options.querySelector(`li[data-value="${initial}"]`);
            if (initialItem) {
                setValue(initial, initialItem.textContent || '1 次');
            } else {
                setValue('1', '1 次');
            }
        }

        function initCustomInviteStatusFilterSelect() {
            const select = document.getElementById('invite-status-filter');
            if (!select || select.tagName !== 'SELECT') return;
            if (select.dataset.customized === '1') return;

            const customId = 'custom-invite-status-filter';
            const root = document.createElement('div');
            root.className = 'custom-select';
            root.id = customId;
            root.innerHTML = `
                <div class="custom-select-trigger"></div>
                <ul class="custom-select-options"></ul>
            `;
            select.insertAdjacentElement('afterend', root);
            select.classList.add('native-select-hidden');
            select.dataset.customized = '1';

            const trigger = root.querySelector('.custom-select-trigger');
            const optionsEl = root.querySelector('.custom-select-options');
            if (!trigger || !optionsEl) return;

            const render = () => {
                const currentValue = String(select.value || '');
                optionsEl.innerHTML = Array.from(select.options).map(opt => {
                    const value = String(opt.value || '');
                    const text = String(opt.textContent || '').trim();
                    const active = value === currentValue ? 'active' : '';
                    return `<li data-value="${escapeHtml(value)}" class="${active}">${escapeHtml(text)}</li>`;
                }).join('');
                const currentOption = select.options[select.selectedIndex] || select.options[0];
                trigger.textContent = currentOption ? String(currentOption.textContent || '').trim() : '全部';
            };

            render();

            trigger.addEventListener('click', (event) => {
                event.stopPropagation();
                root.classList.toggle('open');
            });

            optionsEl.addEventListener('click', (event) => {
                const target = event.target;
                if (!(target instanceof HTMLElement)) return;
                const item = target.closest('li[data-value]');
                if (!item) return;
                const value = item.getAttribute('data-value') || 'all';
                if (select.value !== value) {
                    select.value = value;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                }
                render();
                root.classList.remove('open');
            });

            document.addEventListener('click', (event) => {
                if (!root.contains(event.target)) root.classList.remove('open');
            });
        }
        
        // 加载邀请码列表
        async function loadInviteCodes() {
            const container = document.getElementById('codes-list');
            
            try {
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    headers: getAuthHeaders()
                });
                
                const codes = await resp.json();
                inviteCodesCache = Array.isArray(codes) ? codes : [];
                renderInviteCodes();
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
                const pagination = document.getElementById('codes-pagination');
                if (pagination) pagination.innerHTML = '';
            }
        }

        function getInviteCodeStatus(code) {
            if (code.max_uses > 0 && code.used_count >= code.max_uses) {
                return { className: 'used', text: '已用完', key: 'used' };
            }
            return { className: 'unused', text: '可用', key: 'available' };
        }

        function getFilteredInviteCodes() {
            if (inviteStatusFilter === 'all') return inviteCodesCache.slice();
            return inviteCodesCache.filter(code => getInviteCodeStatus(code).key === inviteStatusFilter);
        }

        function renderInvitePagination(total, page) {
            const container = document.getElementById('codes-pagination');
            if (!container) return;
            const totalPages = Math.max(1, Math.ceil((total || 0) / INVITE_PAGE_SIZE));
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            const prevDisabled = page <= 1 ? 'disabled' : '';
            const nextDisabled = page >= totalPages ? 'disabled' : '';
            const pageItems = [];
            for (let p = 1; p <= totalPages; p++) {
                const activeStyle = p === page
                    ? 'background: rgba(102,126,234,0.45); border-color: rgba(102,126,234,0.8);'
                    : '';
                pageItems.push(
                    `<button class="btn secondary small" style="margin-right:4px;${activeStyle}" onclick="changeInvitePage(${p})">${p}</button>`
                );
            }
            container.innerHTML = `
                <button class="btn secondary small" ${prevDisabled} onclick="changeInvitePage(${page - 1})">上一页</button>
                ${pageItems.join('')}
                <button class="btn secondary small" ${nextDisabled} onclick="changeInvitePage(${page + 1})">下一页</button>
            `;
        }

        function renderInviteCodes() {
            const container = document.getElementById('codes-list');
            if (!container) return;
            const filtered = getFilteredInviteCodes();
            if (!filtered.length) {
                container.innerHTML = '<div class="empty">暂无邀请码</div>';
                const pagination = document.getElementById('codes-pagination');
                if (pagination) pagination.innerHTML = '';
                return;
            }
            const totalPages = Math.max(1, Math.ceil(filtered.length / INVITE_PAGE_SIZE));
            inviteCurrentPage = Math.min(Math.max(1, inviteCurrentPage), totalPages);
            const start = (inviteCurrentPage - 1) * INVITE_PAGE_SIZE;
            const pageItems = filtered.slice(start, start + INVITE_PAGE_SIZE);

            container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>邀请码</th>
                                <th>使用次数</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${pageItems.map(code => {
                                const status = getInviteCodeStatus(code);
                                const usesText = code.max_uses === 0 
                                    ? `${code.used_count} / ∞` 
                                    : `${code.used_count} / ${code.max_uses}`;
                                
                                return `
                                    <tr>
                                        <td><span class="code">${code.code}</span></td>
                                        <td>${usesText}</td>
                                        <td><span class="status ${status.className}">${status.text}</span></td>
                                        <td>${new Date(code.created_at).toLocaleString('zh-CN')}</td>
                                        <td>
                                            <button class="btn danger small" onclick='deleteInviteCode(${JSON.stringify(code.code)})'>删除</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            renderInvitePagination(filtered.length, inviteCurrentPage);
        }

        function changeInviteFilter(value) {
            inviteStatusFilter = String(value || 'all');
            inviteCurrentPage = 1;
            renderInviteCodes();
        }

        function changeInvitePage(page) {
            inviteCurrentPage = Math.max(1, Number(page) || 1);
            renderInviteCodes();
        }

        async function deleteInviteCode(code) {
            const normalized = String(code || '').trim();
            if (!normalized) {
                showToast('邀请码无效', true);
                return;
            }
            if (!confirm(`确认删除邀请码 ${normalized} 吗？删除后不可恢复。`)) return;

            try {
                let resp = await fetch(`${API_BASE}/auth/invite-codes/${encodeURIComponent(normalized)}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (resp.status === 405) {
                    // 兼容某些环境限制 DELETE 的情况
                    resp = await fetch(`${API_BASE}/auth/invite-codes/${encodeURIComponent(normalized)}/delete`, {
                        method: 'POST',
                        headers: getAuthHeaders()
                    });
                }
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '删除邀请码失败', true);
                    return;
                }
                showToast('邀请码已删除');
                inviteCurrentPage = 1;
                loadInviteCodes();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }

        function parseScopesInput(text) {
            return (text || '')
                .split(',')
                .map(v => v.trim())
                .filter(Boolean);
        }

        function formatDate(value) {
            if (!value) return '-';
            return new Date(value).toLocaleString('zh-CN');
        }

        function formatScopes(scopes) {
            if (!Array.isArray(scopes) || scopes.length === 0) return '-';
            return scopes.join(', ');
        }

        function getApiKeyStatus(item) {
            if (!item.is_active) {
                return { className: 'used', text: '已撤销' };
            }
            if (item.expires_at && new Date(item.expires_at) <= new Date()) {
                return { className: 'expired', text: '已过期' };
            }
            return { className: 'unused', text: '可用' };
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            } catch (e) {
                showToast('复制失败，请手动复制', true);
            }
        }

        function showOneTimeApiKey(data, actionText) {
            const panel = document.getElementById('api-key-once');
            const rawKey = data.api_key || '';
            const safeKey = escapeHtml(rawKey);
            const safeName = escapeHtml(data.name || '');
            panel.style.display = 'block';
            panel.innerHTML = `
                <div><strong>${actionText}成功：</strong>${safeName}</div>
                <div class="code">${safeKey}</div>
                <div>
                    <button class="btn secondary small" onclick='copyText(${JSON.stringify(rawKey)})'>复制密钥</button>
                    <span class="hint">该明文不会再次显示</span>
                </div>
            `;
        }

        async function createApiKey() {
            const nameInput = document.getElementById('api-key-name');
            const scopesInput = document.getElementById('api-key-scopes');
            const expiresInput = document.getElementById('api-key-expires');
            const btn = document.getElementById('api-key-create-btn');

            const name = nameInput.value.trim();
            if (!name) {
                showToast('请输入接口密钥名称', true);
                return;
            }

            const body = {
                name,
                scopes: parseScopesInput(scopesInput.value),
                expires_at: expiresInput.value ? new Date(expiresInput.value).toISOString() : null
            };

            btn.disabled = true;
            btn.textContent = '创建中...';
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys`, {
                    method: 'POST',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '创建接口密钥失败', true);
                    return;
                }

                showOneTimeApiKey(data, '创建');
                nameInput.value = '';
                scopesInput.value = '';
                expiresInput.value = '';
                showToast('接口密钥创建成功');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = '创建密钥';
            }
        }

        async function loadApiKeys() {
            const container = document.getElementById('api-keys-list');
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys`, {
                    headers: getAuthHeaders()
                });
                const keys = await resp.json();
                if (!resp.ok) {
                    container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(keys.detail || '请求失败')}</div>`;
                    return;
                }

                if (!keys.length) {
                    container.innerHTML = '<div class="empty">暂无接口密钥</div>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>前缀</th>
                                <th>权限范围</th>
                                <th>状态</th>
                                <th>最后使用</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${keys.map(item => {
                                const status = getApiKeyStatus(item);
                                const scopes = escapeHtml(formatScopes(item.scopes));
                                return `
                                    <tr>
                                        <td>${escapeHtml(item.name)}</td>
                                        <td><span class="code">${escapeHtml(item.key_prefix)}</span></td>
                                        <td>${scopes}</td>
                                        <td><span class="status ${status.className}">${status.text}</span></td>
                                        <td>${formatDate(item.last_used_at)}</td>
                                        <td>
                                            <button class="btn secondary small" onclick="rotateApiKey(${item.id})">轮换</button>
                                            <button class="btn danger small" onclick="revokeApiKey(${item.id})">撤销</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        async function revokeApiKey(id) {
            if (!confirm('确认撤销该接口密钥吗？撤销后无法恢复。')) return;
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '撤销失败', true);
                    return;
                }
                showToast('接口密钥已撤销');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }

        async function rotateApiKey(id) {
            if (!confirm('确认轮换该接口密钥吗？旧密钥会立即失效。')) return;
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys/${id}/rotate`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '轮换失败', true);
                    return;
                }
                showOneTimeApiKey(data, '轮换');
                showToast('接口密钥已轮换');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }
        
        // 显示提示
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        // 初始化
        checkAuth().then(ok => {
            if (ok) {
                initCustomMaxUsesSelect();
                initCustomInviteStatusFilterSelect();
                loadInviteCodes();
                loadApiKeys();
            }
        });
    </script>
</body>
</html>
