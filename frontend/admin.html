<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 令牌监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #e0e0e0;
        }
        
        .header p {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .nav a {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }
        
        .nav a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #999;
            font-size: 14px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group select {
            background-color: #2a2a4a;
        }
        
        .form-group select option {
            background-color: #2a2a4a;
            color: #fff;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.danger {
            background: rgba(244, 67, 54, 0.9);
        }

        .btn.small {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 6px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th {
            color: #888;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        td {
            font-size: 14px;
        }
        
        .code {
            font-family: monospace;
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            color: #667eea;
        }
        
        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .status.unused {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        
        .status.used {
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }
        
        .status.expired {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        .key-once {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
        }

        .key-once .code {
            display: inline-block;
            margin: 8px 0;
            word-break: break-all;
        }

        .sub-title {
            color: #a8b0d3;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .inline-fields {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .inline-fields .form-group {
            min-width: 0;
        }

        .small-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .mini-table th,
        .mini-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .toast.error {
            background: rgba(244, 67, 54, 0.9);
        }
        
        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 管理后台</h1>
            <p id="user-info"></p>
        </div>
        
        <div class="nav">
            <a href="api.html">📊 实时监控</a>
            <a href="setup.html">🔧 设置凭证</a>
            <a href="#" onclick="logout()">🚪 退出登录</a>
        </div>
        
        <!-- 创建邀请码 -->
        <div class="card">
            <h2>🎫 创建邀请码</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>使用次数</label>
                    <select id="max-uses">
                        <option value="1" selected>1 次</option>
                        <option value="5">5 次</option>
                        <option value="10">10 次</option>
                        <option value="50">50 次</option>
                        <option value="100">100 次</option>
                        <option value="0">无限次</option>
                    </select>
                </div>
                <button id="invite-btn" class="btn" onclick="createInviteCode()">生成邀请码</button>
            </div>
        </div>
        
        <!-- 邀请码列表 -->
        <div class="card">
            <h2>📋 邀请码列表</h2>
            <div id="codes-list">
                <div class="empty">加载中...</div>
            </div>
        </div>

        <!-- 接口密钥管理 -->
        <div class="card">
            <h2>🔑 接口密钥管理</h2>
            <p class="hint">明文密钥只会在创建或轮换时展示一次，请立即复制保存。</p>
            <div class="form-row">
                <div class="form-group">
                    <label>名称</label>
                    <input id="api-key-name" type="text" placeholder="例如：运维脚本密钥">
                </div>
                <div class="form-group">
                    <label>权限范围（逗号分隔）</label>
                    <input id="api-key-scopes" type="text" placeholder="cookie:read,cookie:write">
                </div>
                <div class="form-group">
                    <label>过期时间（可选）</label>
                    <input id="api-key-expires" type="datetime-local">
                </div>
                <button id="api-key-create-btn" class="btn" onclick="createApiKey()">创建密钥</button>
            </div>
            <div id="api-key-once" class="key-once" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>🗂️ 接口密钥列表</h2>
            <div id="api-keys-list">
                <div class="empty">加载中...</div>
            </div>
        </div>

        <div class="card">
            <h2>🚨 告警规则管理（最小版）</h2>
            <p class="sub-title">查看规则和事件，并按指标键更新阈值与冷却参数</p>
            <div class="form-row">
                <div class="form-group">
                    <label>选择账号</label>
                    <select id="alert-account-select"></select>
                </div>
                <button class="btn secondary" onclick="reloadAlertData()">刷新规则与事件</button>
            </div>
            <div class="small-note" id="alert-account-hint">请选择账号</div>

            <div class="inline-fields">
                <div class="form-group">
                    <label>指标键</label>
                    <input id="alert-metric-key" type="text" placeholder="例如：配额使用率">
                </div>
                <div class="form-group">
                    <label>阈值（%）</label>
                    <input id="alert-threshold" type="number" step="0.1" value="80">
                </div>
                <div class="form-group">
                    <label>冷却时间（秒）</label>
                    <input id="alert-cooldown" type="number" value="1800">
                </div>
                <div class="form-group">
                    <label>启用状态</label>
                    <select id="alert-enabled">
                        <option value="true" selected>启用</option>
                        <option value="false">停用</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="saveAlertRule()">保存规则</button>

            <h2 style="margin-top:18px;">📋 当前规则</h2>
            <div id="alert-rules-list"><div class="empty">加载中...</div></div>

            <h2 style="margin-top:18px;">🧾 最近事件</h2>
            <div id="alert-events-list"><div class="empty">加载中...</div></div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('token');
        let currentUser = null;
        let alertAccounts = [];

        function getAuthHeaders() {
            return { 'Authorization': `Bearer ${authToken}` };
        }

        function getJsonHeaders() {
            return {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        
        // 检查登录状态和管理员权限
        async function checkAuth() {
            if (!authToken) {
                window.location.href = 'login.html';
                return false;
            }
            
            try {
                const resp = await fetch(`${API_BASE}/auth/me`, {
                    headers: getAuthHeaders()
                });
                
                if (resp.ok) {
                    currentUser = await resp.json();
                    
                    if (currentUser.role !== 'admin') {
                        showToast('需要管理员权限', true);
                        setTimeout(() => {
                            window.location.href = 'api.html';
                        }, 1500);
                        return false;
                    }
                    
                    document.getElementById('user-info').textContent = 
                        `👤 ${currentUser.username} (管理员)`;
                    
                    return true;
                } else {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return false;
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
                return false;
            }
        }
        
        // 创建邀请码
        async function createInviteCode() {
            const maxUses = document.getElementById('max-uses').value;
            const btn = document.getElementById('invite-btn');
            
            btn.disabled = true;
            btn.textContent = '生成中...';
            
            try {
                const body = {
                    max_uses: parseInt(maxUses)
                };
                
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    method: 'POST',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(body)
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    showToast(`邀请码已创建: ${data.code}`);
                    loadInviteCodes();
                } else {
                    showToast(data.detail || '创建失败', true);
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成邀请码';
            }
        }
        
        // 加载邀请码列表
        async function loadInviteCodes() {
            const container = document.getElementById('codes-list');
            
            try {
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    headers: getAuthHeaders()
                });
                
                const codes = await resp.json();
                
                if (codes.length === 0) {
                    container.innerHTML = '<div class="empty">暂无邀请码</div>';
                    return;
                }
                
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>邀请码</th>
                                <th>使用次数</th>
                                <th>状态</th>
                                <th>创建时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${codes.map(code => {
                                let statusClass = 'unused';
                                let statusText = '可用';
                                
                                if (code.max_uses > 0 && code.used_count >= code.max_uses) {
                                    statusClass = 'used';
                                    statusText = '已用完';
                                }
                                
                                const usesText = code.max_uses === 0 
                                    ? `${code.used_count} / ∞` 
                                    : `${code.used_count} / ${code.max_uses}`;
                                
                                return `
                                    <tr>
                                        <td><span class="code">${code.code}</span></td>
                                        <td>${usesText}</td>
                                        <td><span class="status ${statusClass}">${statusText}</span></td>
                                        <td>${new Date(code.created_at).toLocaleString('zh-CN')}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
            }
        }

        function parseScopesInput(text) {
            return (text || '')
                .split(',')
                .map(v => v.trim())
                .filter(Boolean);
        }

        function formatDate(value) {
            if (!value) return '-';
            return new Date(value).toLocaleString('zh-CN');
        }

        function formatScopes(scopes) {
            if (!Array.isArray(scopes) || scopes.length === 0) return '-';
            return scopes.join(', ');
        }

        function getApiKeyStatus(item) {
            if (!item.is_active) {
                return { className: 'used', text: '已撤销' };
            }
            if (item.expires_at && new Date(item.expires_at) <= new Date()) {
                return { className: 'expired', text: '已过期' };
            }
            return { className: 'unused', text: '可用' };
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            } catch (e) {
                showToast('复制失败，请手动复制', true);
            }
        }

        function showOneTimeApiKey(data, actionText) {
            const panel = document.getElementById('api-key-once');
            const rawKey = data.api_key || '';
            const safeKey = escapeHtml(rawKey);
            const safeName = escapeHtml(data.name || '');
            panel.style.display = 'block';
            panel.innerHTML = `
                <div><strong>${actionText}成功：</strong>${safeName}</div>
                <div class="code">${safeKey}</div>
                <div>
                    <button class="btn secondary small" onclick='copyText(${JSON.stringify(rawKey)})'>复制密钥</button>
                    <span class="hint">该明文不会再次显示</span>
                </div>
            `;
        }

        async function createApiKey() {
            const nameInput = document.getElementById('api-key-name');
            const scopesInput = document.getElementById('api-key-scopes');
            const expiresInput = document.getElementById('api-key-expires');
            const btn = document.getElementById('api-key-create-btn');

            const name = nameInput.value.trim();
            if (!name) {
                showToast('请输入接口密钥名称', true);
                return;
            }

            const body = {
                name,
                scopes: parseScopesInput(scopesInput.value),
                expires_at: expiresInput.value ? new Date(expiresInput.value).toISOString() : null
            };

            btn.disabled = true;
            btn.textContent = '创建中...';
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys`, {
                    method: 'POST',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '创建接口密钥失败', true);
                    return;
                }

                showOneTimeApiKey(data, '创建');
                nameInput.value = '';
                scopesInput.value = '';
                expiresInput.value = '';
                showToast('接口密钥创建成功');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = '创建密钥';
            }
        }

        async function loadApiKeys() {
            const container = document.getElementById('api-keys-list');
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys`, {
                    headers: getAuthHeaders()
                });
                const keys = await resp.json();
                if (!resp.ok) {
                    container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(keys.detail || '请求失败')}</div>`;
                    return;
                }

                if (!keys.length) {
                    container.innerHTML = '<div class="empty">暂无接口密钥</div>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>前缀</th>
                                <th>权限范围</th>
                                <th>状态</th>
                                <th>最后使用</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${keys.map(item => {
                                const status = getApiKeyStatus(item);
                                const scopes = escapeHtml(formatScopes(item.scopes));
                                return `
                                    <tr>
                                        <td>${escapeHtml(item.name)}</td>
                                        <td><span class="code">${escapeHtml(item.key_prefix)}</span></td>
                                        <td>${scopes}</td>
                                        <td><span class="status ${status.className}">${status.text}</span></td>
                                        <td>${formatDate(item.last_used_at)}</td>
                                        <td>
                                            <button class="btn secondary small" onclick="rotateApiKey(${item.id})">轮换</button>
                                            <button class="btn danger small" onclick="revokeApiKey(${item.id})">撤销</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        function getSelectedAlertAccountId() {
            const el = document.getElementById("alert-account-select");
            return el ? Number(el.value || 0) : 0;
        }

        function renderAlertAccountOptions() {
            const select = document.getElementById("alert-account-select");
            const hint = document.getElementById("alert-account-hint");
            if (!select) return;

            if (!alertAccounts.length) {
                select.innerHTML = '<option value="">无可用账号</option>';
                if (hint) hint.textContent = "当前无账号，请先在监控页配置服务账号";
                return;
            }

            select.innerHTML = alertAccounts
                .map(item => `<option value="${item.id}">${escapeHtml(item.service_icon || "🧩")} ${escapeHtml(item.name || item.service_name || item.service_id)} (ID:${item.id})</option>`)
                .join("");
            if (hint) hint.textContent = "支持按账号 ID + 指标键维度管理规则";
        }

        async function loadAlertAccounts() {
            try {
                const resp = await fetch(`${API_BASE}/api/accounts`, {
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "加载账号失败");
                alertAccounts = Array.isArray(data) ? data : [];
                renderAlertAccountOptions();
                await reloadAlertData();
            } catch (e) {
                showToast("加载告警账号失败: " + e.message, true);
            }
        }

        async function loadAlertRules(accountId) {
            const container = document.getElementById("alert-rules-list");
            if (!container) return;
            if (!accountId) {
                container.innerHTML = '<div class="empty">请先选择账号</div>';
                return;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/accounts/${accountId}/alerts`, {
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "加载规则失败");
                if (!data.length) {
                    container.innerHTML = '<div class="empty">暂无规则（保存后自动创建）</div>';
                    return;
                }
                container.innerHTML = `
                    <table class="mini-table">
                        <thead>
                            <tr>
                                <th>指标键</th>
                                <th>阈值</th>
                                <th>冷却秒数</th>
                                <th>已启用</th>
                                <th>告警中</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.metric_key)}</td>
                                    <td>${item.threshold}</td>
                                    <td>${item.cooldown_seconds}</td>
                                    <td>${item.is_enabled}</td>
                                    <td>${item.is_firing}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        async function loadAlertEvents(accountId) {
            const container = document.getElementById("alert-events-list");
            if (!container) return;
            if (!accountId) {
                container.innerHTML = '<div class="empty">请先选择账号</div>';
                return;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/accounts/${accountId}/alerts/events?limit=20&offset=0`, {
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || "加载事件失败");
                const items = Array.isArray(data.items) ? data.items : [];
                if (!items.length) {
                    container.innerHTML = '<div class="empty">暂无事件</div>';
                    return;
                }
                container.innerHTML = `
                    <table class="mini-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>指标</th>
                                <th>状态</th>
                                <th>使用率</th>
                                <th>消息</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>${formatDate(item.created_at)}</td>
                                    <td>${escapeHtml(item.metric_key || "-")}</td>
                                    <td>${escapeHtml(item.status || "-")}</td>
                                    <td>${item.observed_percent == null ? "-" : item.observed_percent}</td>
                                    <td>${escapeHtml(item.message || "-")}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
            }
        }

        async function reloadAlertData() {
            const accountId = getSelectedAlertAccountId();
            await Promise.all([loadAlertRules(accountId), loadAlertEvents(accountId)]);
        }

        async function saveAlertRule() {
            const accountId = getSelectedAlertAccountId();
            const metricKey = (document.getElementById("alert-metric-key").value || "").trim();
            const threshold = Number(document.getElementById("alert-threshold").value || "80");
            const cooldown = Number(document.getElementById("alert-cooldown").value || "1800");
            const enabled = (document.getElementById("alert-enabled").value || "true") === "true";

            if (!accountId) {
                showToast("请先选择账号", true);
                return;
            }
            if (!metricKey) {
                showToast("请输入指标键", true);
                return;
            }
            if (!Number.isFinite(threshold) || threshold < 0) {
                showToast("阈值无效", true);
                return;
            }
            if (!Number.isFinite(cooldown) || cooldown < 0) {
                showToast("冷却时间无效", true);
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/accounts/${accountId}/alerts/${encodeURIComponent(metricKey)}`, {
                    method: "PUT",
                    headers: getJsonHeaders(),
                    body: JSON.stringify({
                        threshold,
                        cooldown_seconds: Math.floor(cooldown),
                        is_enabled: enabled,
                        notify_channels: ["log"]
                    })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || "保存规则失败", true);
                    return;
                }
                showToast("规则已保存");
                await reloadAlertData();
            } catch (e) {
                showToast("网络错误: " + e.message, true);
            }
        }

        async function revokeApiKey(id) {
            if (!confirm('确认撤销该接口密钥吗？撤销后无法恢复。')) return;
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '撤销失败', true);
                    return;
                }
                showToast('接口密钥已撤销');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }

        async function rotateApiKey(id) {
            if (!confirm('确认轮换该接口密钥吗？旧密钥会立即失效。')) return;
            try {
                const resp = await fetch(`${API_BASE}/auth/api-keys/${id}/rotate`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '轮换失败', true);
                    return;
                }
                showOneTimeApiKey(data, '轮换');
                showToast('接口密钥已轮换');
                loadApiKeys();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }
        
        // 显示提示
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        // 初始化
        checkAuth().then(ok => {
            if (ok) {
                loadInviteCodes();
                loadApiKeys();
                loadAlertAccounts();
                document.getElementById("alert-account-select")?.addEventListener("change", reloadAlertData);
            }
        });
    </script>
</body>
</html>
