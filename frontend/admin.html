<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 令牌监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg-dark: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.08);
            --bg-card-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #a8b0d3;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius-lg: 16px;
            --transition-normal: 0.25s ease;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .header p {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        
        .header-user-bar {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            gap: 8px 10px;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
        }
        .header-user-bar > * {
            flex-shrink: 0;
            white-space: nowrap;
        }
        .header-top-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .header-top-link:hover {
            color: #8b9cff;
        }
        
        .card {
            position: relative;
            z-index: 0;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }

        /* 下拉展开时托起整张卡片，避免被下方卡片盖住 */
        .card:has(.custom-select.open) {
            z-index: 60;
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #999;
            font-size: 14px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-shadow: none;
            transition: none;
        }
        
        .form-group select {
            background-color: rgba(255, 255, 255, 0.1);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .form-group select option {
            background-color: #2a2a4a;
            color: #fff;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: none;
        }

        .form-group select:active {
            outline: none;
            border-color: #667eea;
            box-shadow: none;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .custom-select {
            position: relative;
            width: 100%;
            user-select: none;
        }
        .custom-select-trigger {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            position: relative;
        }
        .custom-select-trigger::after {
            content: "▾";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8b0d3;
            font-size: 12px;
        }
        .custom-select.open .custom-select-trigger {
            border-color: #667eea;
        }
        .custom-select-options {
            list-style: none;
            margin: 6px 0 0 0;
            padding: 6px;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            z-index: 80;
            border-radius: 10px;
            background: rgba(30, 34, 58, 0.98);
            border: 1px solid rgba(102, 126, 234, 0.35);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            display: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .custom-select.open .custom-select-options {
            display: block;
        }
        .custom-select-options li {
            padding: 10px 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #dbe3ff;
            cursor: pointer;
        }
        .custom-select-options li:hover {
            background: rgba(102, 126, 234, 0.22);
        }
        .custom-select-options li.active {
            background: rgba(102, 126, 234, 0.35);
            color: #fff;
        }
        .native-select-hidden {
            display: none !important;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.danger {
            background: rgba(244, 67, 54, 0.9);
        }

        .btn.small {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 6px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th {
            color: #888;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        td {
            font-size: 14px;
        }
        
        .code {
            font-family: monospace;
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            color: #667eea;
        }
        
        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .status.unused {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        
        .status.used {
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }
        
        .status.expired {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        .sub-title {
            color: #a8b0d3;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .inline-fields {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .inline-fields .form-group {
            min-width: 0;
        }

        .small-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .mini-table th,
        .mini-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            z-index: 9998;
            background: rgba(76, 175, 80, 0.92);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: block;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            max-width: min(420px, calc(100vw - 32px));
            text-align: center;
            box-sizing: border-box;
            transition:
                opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.38s cubic-bezier(0.34, 1.1, 0.64, 1),
                visibility 0s linear 0.38s;
        }

        .toast.error {
            background: rgba(244, 67, 54, 0.92);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
            transition:
                opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.42s cubic-bezier(0.34, 1.12, 0.64, 1),
                visibility 0s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 管理后台</h1>
            <div id="user-info" class="header-user-bar"></div>
        </div>

        <!-- 平台用户 -->
        <div class="card">
            <h2>👥 平台用户</h2>
            <p class="hint">管理用户角色、启用状态和登录密码（重置密码后立即生效）。勿禁用最后一个管理员。</p>
            <div id="admin-users-list">
                <div class="empty">加载中...</div>
            </div>
            <div id="admin-users-pagination" class="small-note" style="margin-top: 8px;"></div>
        </div>
        
        <!-- 创建邀请码 -->
        <div class="card">
            <h2>🎫 创建邀请码</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>使用次数</label>
                    <input id="max-uses" type="hidden" value="1">
                    <div class="custom-select" id="custom-max-uses">
                        <div class="custom-select-trigger" id="custom-max-uses-trigger">1 次</div>
                        <ul class="custom-select-options" id="custom-max-uses-options">
                            <li data-value="1" class="active">1 次</li>
                            <li data-value="5">5 次</li>
                            <li data-value="10">10 次</li>
                            <li data-value="50">50 次</li>
                            <li data-value="100">100 次</li>
                            <li data-value="0">无限次</li>
                        </ul>
                    </div>
                </div>
                <button id="invite-btn" class="btn" onclick="createInviteCode()">生成邀请码</button>
            </div>
        </div>
        
        <!-- 邀请码列表 -->
        <div class="card">
            <h2>📋 邀请码列表</h2>
            <div class="form-row" style="margin-bottom: 10px;">
                <div class="form-group" style="max-width: 180px;">
                    <label>状态筛选</label>
                    <select id="invite-status-filter" onchange="changeInviteFilter(this.value)">
                        <option value="all">全部</option>
                        <option value="available">可用</option>
                        <option value="used">已用完</option>
                    </select>
                </div>
                <div style="flex: 1;"></div>
            </div>
            <div id="codes-list">
                <div class="empty">加载中...</div>
            </div>
            <div id="codes-pagination" class="small-note" style="margin-top: 8px;"></div>
        </div>

    </div>
    
    <div id="toast" class="toast"></div>
    
    <script src="js/api-dashboard-state.js"></script>
    <script src="js/api-dashboard-core.js"></script>
    <script src="js/ui-shared.js"></script>
    <script src="js/dashboard-auth.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script>
        const U = window.TMDCore;
        const Ui = window.TMDUi;
        const S = window.TMD;
        const TMDAuth = window.TMDAuth;
        const API_BASE = S.API_BASE;
        const CURRENT_PAGE = S.CURRENT_PAGE;
        let inviteCodesCache = [];
        let inviteStatusFilter = 'all';
        let inviteCurrentPage = 1;
        const INVITE_PAGE_SIZE = 5;
        let adminUsersCache = [];
        let adminUsersPage = 1;
        const ADMIN_USERS_PAGE_SIZE = 8;

        const getAuthHeaders = () => TMDAuth.getAuthHeaders();
        const getJsonHeaders = () => TMDAuth.getJsonHeaders();

        const escapeHtml = (text) => U.escapeHtml(text);

        function showToast(msg, isError) {
            Ui.showToast(msg, isError);
        }

        async function checkAuth() {
            return TMDAuth.checkAuth({
                requireAdmin: true,
                forceShowAdminLink: true,
                onNotAdmin() {
                    showToast('需要管理员权限', true);
                    setTimeout(() => {
                        window.location.href = 'api.html';
                    }, 1500);
                },
            });
        }
        
        // 创建邀请码
        async function createInviteCode() {
            const maxUses = document.getElementById('max-uses').value;
            const btn = document.getElementById('invite-btn');
            
            btn.disabled = true;
            btn.textContent = '生成中...';
            
            try {
                const body = {
                    max_uses: parseInt(maxUses)
                };
                
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    method: 'POST',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(body)
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    showToast(`邀请码已创建: ${data.code}`);
                    loadInviteCodes();
                } else {
                    showToast(data.detail || '创建失败', true);
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成邀请码';
            }
        }

        function initCustomMaxUsesSelect() {
            const root = document.getElementById('custom-max-uses');
            const trigger = document.getElementById('custom-max-uses-trigger');
            const options = document.getElementById('custom-max-uses-options');
            const hidden = document.getElementById('max-uses');
            if (!root || !trigger || !options || !hidden) return;

            const close = () => root.classList.remove('open');
            const open = () => root.classList.add('open');
            const toggle = () => root.classList.toggle('open');

            const setValue = (value, text) => {
                hidden.value = String(value || '1');
                trigger.textContent = text || '1 次';
                options.querySelectorAll('li').forEach(li => {
                    li.classList.toggle('active', li.getAttribute('data-value') === hidden.value);
                });
            };

            trigger.addEventListener('click', (event) => {
                event.stopPropagation();
                toggle();
            });

            options.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setValue(li.getAttribute('data-value') || '1', li.textContent || '1 次');
                    close();
                });
            });

            document.addEventListener('click', (event) => {
                if (!root.contains(event.target)) close();
            });

            const initial = hidden.value || '1';
            const initialItem = options.querySelector(`li[data-value="${initial}"]`);
            if (initialItem) {
                setValue(initial, initialItem.textContent || '1 次');
            } else {
                setValue('1', '1 次');
            }
        }

        // 加载邀请码列表
        async function loadInviteCodes() {
            const container = document.getElementById('codes-list');
            
            try {
                const resp = await fetch(`${API_BASE}/auth/invite-codes`, {
                    headers: getAuthHeaders()
                });
                
                const codes = await resp.json();
                inviteCodesCache = Array.isArray(codes) ? codes : [];
                renderInviteCodes();
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
                const pagination = document.getElementById('codes-pagination');
                if (pagination) pagination.innerHTML = '';
            }
        }

        function getInviteCodeStatus(code) {
            if (code.max_uses > 0 && code.used_count >= code.max_uses) {
                return { className: 'used', text: '已用完', key: 'used' };
            }
            return { className: 'unused', text: '可用', key: 'available' };
        }

        function getFilteredInviteCodes() {
            if (inviteStatusFilter === 'all') return inviteCodesCache.slice();
            return inviteCodesCache.filter(code => getInviteCodeStatus(code).key === inviteStatusFilter);
        }

        function renderInvitePagination(total, page) {
            const container = document.getElementById('codes-pagination');
            if (!container) return;
            const totalPages = Math.max(1, Math.ceil((total || 0) / INVITE_PAGE_SIZE));
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            const prevDisabled = page <= 1 ? 'disabled' : '';
            const nextDisabled = page >= totalPages ? 'disabled' : '';
            const pageItems = [];
            for (let p = 1; p <= totalPages; p++) {
                const activeStyle = p === page
                    ? 'background: rgba(102,126,234,0.45); border-color: rgba(102,126,234,0.8);'
                    : '';
                pageItems.push(
                    `<button class="btn secondary small" style="margin-right:4px;${activeStyle}" onclick="changeInvitePage(${p})">${p}</button>`
                );
            }
            container.innerHTML = `
                <button type="button" class="btn secondary small" ${prevDisabled} onclick="changeInvitePage(${page - 1})">上一页</button>
                ${pageItems.join('')}
                <button type="button" class="btn secondary small" ${nextDisabled} onclick="changeInvitePage(${page + 1})">下一页</button>
                <span style="margin-left:8px;color:#888;">共 ${total} 条</span>
            `;
        }

        function renderInviteCodes() {
            const container = document.getElementById('codes-list');
            if (!container) return;
            const filtered = getFilteredInviteCodes();
            if (!filtered.length) {
                container.innerHTML = '<div class="empty">暂无邀请码</div>';
                const pagination = document.getElementById('codes-pagination');
                if (pagination) pagination.innerHTML = '';
                return;
            }
            const totalPages = Math.max(1, Math.ceil(filtered.length / INVITE_PAGE_SIZE));
            inviteCurrentPage = Math.min(Math.max(1, inviteCurrentPage), totalPages);
            const start = (inviteCurrentPage - 1) * INVITE_PAGE_SIZE;
            const pageItems = filtered.slice(start, start + INVITE_PAGE_SIZE);

            container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>邀请码</th>
                                <th>使用次数</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${pageItems.map(code => {
                                const status = getInviteCodeStatus(code);
                                const usesText = code.max_uses === 0 
                                    ? `${code.used_count} / ∞` 
                                    : `${code.used_count} / ${code.max_uses}`;
                                
                                return `
                                    <tr>
                                        <td><span class="code">${code.code}</span></td>
                                        <td>${usesText}</td>
                                        <td><span class="status ${status.className}">${status.text}</span></td>
                                        <td>${new Date(code.created_at).toLocaleString('zh-CN')}</td>
                                        <td>
                                            <button class="btn danger small" onclick='deleteInviteCode(${JSON.stringify(code.code)})'>删除</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            renderInvitePagination(filtered.length, inviteCurrentPage);
        }

        function changeInviteFilter(value) {
            inviteStatusFilter = String(value || 'all');
            inviteCurrentPage = 1;
            renderInviteCodes();
        }

        function changeInvitePage(page) {
            inviteCurrentPage = Math.max(1, Number(page) || 1);
            renderInviteCodes();
        }

        async function deleteInviteCode(code) {
            const normalized = String(code || '').trim();
            if (!normalized) {
                showToast('邀请码无效', true);
                return;
            }
            if (!(await Ui.showConfirmModal({
                title: '删除邀请码',
                message: `确认删除邀请码 ${normalized} 吗？删除后不可恢复。`,
                confirmText: '删除',
                danger: true,
            }))) return;

            try {
                let resp = await fetch(`${API_BASE}/auth/invite-codes/${encodeURIComponent(normalized)}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (resp.status === 405) {
                    // 兼容某些环境限制 DELETE 的情况
                    resp = await fetch(`${API_BASE}/auth/invite-codes/${encodeURIComponent(normalized)}/delete`, {
                        method: 'POST',
                        headers: getAuthHeaders()
                    });
                }
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '删除邀请码失败', true);
                    return;
                }
                showToast('邀请码已删除');
                inviteCurrentPage = 1;
                loadInviteCodes();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }

        async function loadAdminUsers() {
            const container = document.getElementById('admin-users-list');
            const pagEl = document.getElementById('admin-users-pagination');
            try {
                const resp = await fetch(`${API_BASE}/api/admin/users?page=${adminUsersPage}&page_size=${ADMIN_USERS_PAGE_SIZE}`, {
                    headers: getAuthHeaders()
                });
                const data = await resp.json();
                if (!resp.ok) {
                    container.innerHTML = `<div class="empty">${escapeHtml(data.detail || '加载失败')}</div>`;
                    if (pagEl) pagEl.innerHTML = '';
                    return;
                }
                adminUsersCache = Array.isArray(data.items) ? data.items : [];
                const total = Number(data.total || 0);
                const totalPages = Math.max(1, Math.ceil(total / ADMIN_USERS_PAGE_SIZE));
                adminUsersPage = Math.min(Math.max(1, adminUsersPage), totalPages);
                if (!adminUsersCache.length) {
                    container.innerHTML = '<div class="empty">暂无用户</div>';
                    renderAdminUsersPagination(total, adminUsersPage);
                    return;
                }
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>角色</th>
                                <th>状态</th>
                                <th>新密码</th>
                                <th>注册时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${adminUsersCache.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td>${escapeHtml(u.username)}</td>
                                    <td>
                                        <select id="admin-user-role-${u.id}">
                                            <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
                                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
                                        </select>
                                    </td>
                                    <td><label><input type="checkbox" id="admin-user-active-${u.id}" ${u.is_active ? 'checked' : ''}> 启用</label></td>
                                    <td><input type="password" id="admin-user-pw-${u.id}" placeholder="不改请留空" autocomplete="new-password" style="min-width:120px;"></td>
                                    <td>${new Date(u.created_at).toLocaleString('zh-CN')}</td>
                                    <td><button type="button" class="btn secondary small" onclick="patchAdminUser(${u.id})">保存</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                renderAdminUsersPagination(total, adminUsersPage);
            } catch (e) {
                container.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
                if (pagEl) pagEl.innerHTML = '';
            }
        }

        function renderAdminUsersPagination(total, page) {
            const pagEl = document.getElementById('admin-users-pagination');
            if (!pagEl) return;
            const totalPages = Math.max(1, Math.ceil(total / ADMIN_USERS_PAGE_SIZE));
            if (totalPages <= 1) {
                pagEl.innerHTML = total ? `<span style="color:#888;">共 ${total} 人</span>` : '';
                return;
            }
            const prev = page <= 1 ? 'disabled' : '';
            const next = page >= totalPages ? 'disabled' : '';
            let btns = '';
            for (let p = 1; p <= totalPages; p++) {
                const st = p === page ? 'background: rgba(102,126,234,0.45);' : '';
                btns += `<button type="button" class="btn secondary small" style="margin-right:4px;${st}" onclick="changeAdminUsersPage(${p})">${p}</button>`;
            }
            pagEl.innerHTML = `
                <button type="button" class="btn secondary small" ${prev} onclick="changeAdminUsersPage(${page - 1})">上一页</button>
                ${btns}
                <button type="button" class="btn secondary small" ${next} onclick="changeAdminUsersPage(${page + 1})">下一页</button>
                <span style="margin-left:8px;color:#888;">共 ${total} 人</span>
            `;
        }

        function changeAdminUsersPage(p) {
            adminUsersPage = Math.max(1, Number(p) || 1);
            loadAdminUsers();
        }

        async function patchAdminUser(userId) {
            const roleEl = document.getElementById(`admin-user-role-${userId}`);
            const actEl = document.getElementById(`admin-user-active-${userId}`);
            const pwEl = document.getElementById(`admin-user-pw-${userId}`);
            if (!roleEl || !actEl) return;
            const payload = {
                role: roleEl.value,
                is_active: actEl.checked
            };
            const pw = (pwEl && pwEl.value) ? pwEl.value.trim() : '';
            if (pw) payload.new_password = pw;
            try {
                const resp = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'PATCH',
                    headers: getJsonHeaders(),
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.detail || '保存失败', true);
                    return;
                }
                showToast('用户已更新');
                if (pwEl) pwEl.value = '';
                loadAdminUsers();
            } catch (e) {
                showToast('网络错误: ' + e.message, true);
            }
        }
        
        // 退出登录
        async function logout() {
            await TMDAuth.logout();
        }
        
        // 初始化
        checkAuth().then(ok => {
            if (ok) {
                initCustomMaxUsesSelect();
                Ui.bindCustomSelectById('invite-status-filter');
                loadAdminUsers();
                loadInviteCodes();
            }
        });
    </script>
</body>
</html>
