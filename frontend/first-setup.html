<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首次设置 - Token Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                0 24px 64px rgba(15, 23, 42, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.12) inset;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            backdrop-filter: blur(12px);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 28px; color: #333; }
        .logo p { color: #666; margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .success {
            background: #efe;
            color: #060;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .blocked {
            text-align: center;
            color: #555;
            line-height: 1.6;
        }
        .blocked a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        .intro {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .gate { text-align: center; color: #666; padding: 24px 0; }
    </style>
</head>
<body>
    <div id="page-gate" class="container gate">正在加载…</div>

    <div id="blocked-flow" class="container" style="display:none;">
        <div class="logo">
            <h1>✨ Token Monitor</h1>
            <p>系统已配置</p>
        </div>
        <div class="blocked">
            <p>管理员账号已存在，无法通过本页再次初始化。</p>
            <p style="margin-top:16px;"><a href="login.html">前往登录</a></p>
        </div>
    </div>

    <div id="setup-flow" class="container" style="display:none;">
        <div class="logo">
            <h1>✨ Token Monitor</h1>
            <p>首次使用 · 创建管理员</p>
        </div>
        <p class="intro">请设置管理员用户名与密码。</p>
        <div id="setup-error" class="error"></div>
        <div id="setup-success" class="success"></div>
        <form id="setup-form">
            <div class="form-group">
                <label>管理员用户名</label>
                <input type="text" id="setup-username" required maxlength="20" autocomplete="username" placeholder="3-20 位，字母开头">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="setup-password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位，含大写、小写、数字">
            </div>
            <button type="submit" class="btn" id="setup-submit">创建并进入系统</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;">
            <a href="login.html" style="color:#667eea;text-decoration:none;">已有账号？去登录</a>
        </p>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const REG_USERNAME = /^[a-zA-Z][a-zA-Z0-9_]{2,19}$/;
        const REG_PASSWORD = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        function validateUsername(raw) {
            const u = String(raw).trim();
            if (u.length < 3) return '用户名至少3字符';
            if (u.length > 20) return '用户名最多20字符';
            if (!REG_USERNAME.test(u)) return '用户名须字母开头，仅字母数字下划线';
            return null;
        }
        function validatePassword(p) {
            const s = String(p);
            if (s.length < 8) return '密码至少8位';
            if (!/[A-Z]/.test(s)) return '密码须包含大写字母';
            if (!/[a-z]/.test(s)) return '密码须包含小写字母';
            if (!/\d/.test(s)) return '密码须包含数字';
            if (!REG_PASSWORD.test(s)) return '密码格式不正确';
            return null;
        }
        function normalizeDetailMsg(msg) {
            return String(msg).replace(/^Value error,?\s*/i, '').trim();
        }

        (async function init() {
            const gate = document.getElementById('page-gate');
            const blocked = document.getElementById('blocked-flow');
            const setup = document.getElementById('setup-flow');

            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const r = await fetch(`${API_BASE}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (r.ok) {
                        window.location.href = 'api.html';
                        return;
                    }
                } catch (e) {}
            }

            let hasAdmin = true;
            try {
                const r = await fetch(`${API_BASE}/auth/setup-status`);
                if (r.ok) {
                    const j = await r.json();
                    hasAdmin = !!j.hasAdmin;
                }
            } catch (e) {}

            gate.style.display = 'none';
            if (hasAdmin) {
                blocked.style.display = 'block';
                return;
            }
            setup.style.display = 'block';
        })();

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('setup-error');
            const okEl = document.getElementById('setup-success');
            errEl.style.display = 'none';
            okEl.style.display = 'none';

            const username = document.getElementById('setup-username').value;
            const password = document.getElementById('setup-password').value;
            const uErr = validateUsername(username);
            if (uErr) {
                errEl.textContent = uErr;
                errEl.style.display = 'block';
                return;
            }
            const pErr = validatePassword(password);
            if (pErr) {
                errEl.textContent = pErr;
                errEl.style.display = 'block';
                return;
            }

            const btn = document.getElementById('setup-submit');
            btn.disabled = true;
            try {
                const resp = await fetch(`${API_BASE}/auth/setup-first`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username.trim(), password })
                });
                const data = await resp.json();
                if (resp.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user_id,
                        username: data.username,
                        role: data.role
                    }));
                    okEl.textContent = '创建成功，正在进入系统…';
                    okEl.style.display = 'block';
                    setTimeout(() => { window.location.href = 'api.html'; }, 600);
                } else {
                    const detail = data.detail;
                    const msg = Array.isArray(detail)
                        ? detail.map(x => normalizeDetailMsg(x.msg || x.message || '')).join('；')
                        : normalizeDetailMsg(typeof detail === 'string' ? detail : '创建失败');
                    errEl.textContent = msg || '创建失败';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = '网络错误：' + err.message;
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
