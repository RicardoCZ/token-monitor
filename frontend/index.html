<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Token Monitor ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
        }
        
        .header h1 { font-size: 24px; color: #e0e0e0; margin-bottom: 5px; }
        .header p { font-size: 12px; color: #888; }
        
        .cards { max-width: 600px; margin: 0 auto; }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card-title { font-size: 18px; font-weight: 600; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        
        .badge-ok { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .badge-error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #999; font-size: 14px; }
        .stat-value { font-weight: 600; font-size: 14px; }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 12px;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-fill.green { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .progress-fill.orange { background: linear-gradient(90deg, #FF9800, #FFC107); }
        .progress-fill.red { background: linear-gradient(90deg, #f44336, #E91E63); }
        
        .loading { text-align: center; padding: 30px; color: #888; }
        
        .login-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .login-btn:active { transform: scale(0.98); }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .last-update {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Token Monitor</h1>
        <p>API 额度实时监控</p>
    </div>
    
    <div class="cards">
        <div class="card">
            <div class="card-header">
                <span class="card-title">🟠 MiniMax</span>
                <span class="badge badge-ok" id="minimax-badge">加载中</span>
            </div>
            <div id="minimax-content">
                <div class="loading">正在查询...</div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="card-title">🔵 讯飞星辰</span>
                <span class="badge badge-ok" id="xfyun-badge">加载中</span>
            </div>
            <div id="xfyun-content">
                <div class="loading">正在查询...</div>
            </div>
        </div>
    </div>
    
    <div class="last-update" id="last-update"></div>
    
    <div style="text-align:center;margin-top:15px;">
        <a href="/setup" style="color:#888;font-size:12px;text-decoration:none;">⚙️ Cookie 设置</a>
    </div>
    
    <button class="refresh-btn" onclick="refreshAll()">↻</button>
    
    <script>
        // 配置：后端 API 地址
        // 部署时请修改为你的后端服务地址
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:5188' 
            : '';
        
        async function refreshAll() {
            await Promise.all([refreshMinimax(), refreshXfyun()]);
            document.getElementById('last-update').textContent = 
                '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
        }
        
        async function refreshMinimax() {
            const badge = document.getElementById('minimax-badge');
            const content = document.getElementById('minimax-content');
            
            try {
                const resp = await fetch(`${API_BASE}/api/minimax`);
                const data = await resp.json();
                
                if (data.error) {
                    badge.className = 'badge badge-error';
                    badge.textContent = '需登录';
                    content.innerHTML = `
                        <p style="color: #f44336; font-size: 13px; margin-bottom: 10px;">${data.error}</p>
                        <button class="login-btn" style="margin-top: 8px;" onclick="refreshAll()">我已登录，刷新</button>
                        <button class="login-btn" style="margin-top: 8px;" onclick="window.location.href='/setup'">去设置 Cookie</button>
                    `;
                    return;
                }
                
                badge.className = 'badge badge-ok';
                badge.textContent = '正常';
                
                // 使用 page_info 格式
                const pageInfo = data.page_info || {};
                const used = pageInfo.used ?? 0;
                const total = pageInfo.total ?? 0;
                const percent = pageInfo.percent ?? 0;
                const expiresAt = pageInfo.expiresAt || '-';
                const resetHours = pageInfo.resetHours || 0;
                const resetMinutes = pageInfo.resetMinutes || 0;
                
                const resetTime = resetHours > 0 
                    ? `${resetHours}小时${resetMinutes}分钟` 
                    : `${resetMinutes}分钟`;
                
                const color = percent > 80 ? 'red' : percent > 50 ? 'orange' : 'green';
                
                content.innerHTML = `
                    <div class="stat-row"><span class="stat-label">使用量</span><span class="stat-value">${used}/${total} (${percent}%)</span></div>
                    <div class="stat-row"><span class="stat-label">截止日期</span><span class="stat-value">${expiresAt}</span></div>
                    <div class="stat-row"><span class="stat-label">重置时间</span><span class="stat-value">${resetTime}</span></div>
                    <div class="progress-bar"><div class="progress-fill ${color}" style="width:${percent}%"></div></div>
                `;
            } catch (e) {
                badge.className = 'badge badge-error';
                badge.textContent = '错误';
                content.innerHTML = `<p style="color:#f44336;font-size:12px;">${e.message}</p>`;
            }
        }
        
        async function refreshXfyun() {
            const badge = document.getElementById('xfyun-badge');
            const content = document.getElementById('xfyun-content');
            
            try {
                const resp = await fetch(`${API_BASE}/api/xfyun`);
                const data = await resp.json();
                
                if (data.error) {
                    badge.className = 'badge badge-error';
                    badge.textContent = '需登录';
                    content.innerHTML = `
                        <p style="color: #f44336; font-size: 13px; margin-bottom: 10px;">${data.error}</p>
                        <button class="login-btn" style="margin-top: 8px;" onclick="refreshAll()">我已登录，刷新</button>
                        <button class="login-btn" style="margin-top: 8px;" onclick="window.location.href='/setup'">去设置 Cookie</button>
                    `;
                    return;
                }
                
                badge.className = 'badge badge-ok';
                badge.textContent = '正常';
                
                // 使用 page_info 格式
                const pageInfo = data.page_info || {};
                const dailyQuota = pageInfo.dailyQuota || 0;
                const dailyUsed = pageInfo.dailyUsed || 0;
                const dailyRemain = pageInfo.dailyRemain || 0;
                const expiresAt = pageInfo.expiresAt || '-';
                
                const percent = dailyQuota > 0 ? (dailyUsed / dailyQuota * 100).toFixed(1) : 0;
                const color = percent > 80 ? 'red' : percent > 50 ? 'orange' : 'green';
                
                content.innerHTML = `
                    <div class="stat-row"><span class="stat-label">每日额度</span><span class="stat-value">${dailyQuota} 万</span></div>
                    <div class="stat-row"><span class="stat-label">今日已用</span><span class="stat-value">${dailyUsed} 万</span></div>
                    <div class="stat-row"><span class="stat-label">今日剩余</span><span class="stat-value">${dailyRemain} 万</span></div>
                    <div class="stat-row"><span class="stat-label">使用率</span><span class="stat-value">${percent}%</span></div>
                    <div class="progress-bar"><div class="progress-fill ${color}" style="width:${percent}%"></div></div>
                    <div class="stat-row" style="margin-top:10px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">
                        <span class="stat-label">到期时间</span><span class="stat-value">${expiresAt}</span>
                    </div>
                `;
            } catch (e) {
                badge.className = 'badge badge-error';
                badge.textContent = '错误';
                content.innerHTML = `<p style="color:#f44336;font-size:12px;">${e.message}</p>`;
            }
        }
        
        refreshAll();
        setInterval(refreshAll, 60000);
    </script>
</body>
</html>
